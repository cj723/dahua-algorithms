          "#include <stdio.h>",
          "#include <stdlib.h>",
          "#include <string.h>",
          "",
          "/* 统计整数 n 的二进制表示中有多少个 1 */",
          "/* 思路：每次 n & (n - 1) 清掉最低位的 1，计数 + 1 */",
          "/* 类比：拔萝卜——每次拔掉最矮的那个萝卜，数拔了几次 */",
          "",
          "int count_bits(unsigned int n) {",
          "    int count = 0;          /* 计数器初始化为 0 */",
          "    while (n != 0) {        /* 只要 n 不为 0，说明还有 1 */",
          "        n = n & (n - 1);    /* 清掉最低位的 1 */",
          "        count++;            /* 计数加 1 */",
          "    }",
          "    return count;           /* 返回 1 的个数 */",
          "}",

          "#include <stdlib.h>",
          "#include <string.h>",
          "",
          "/* 不使用临时变量，交换 a 和 b 的值 */",
          "/* 利用异或的性质：a ^ a = 0, a ^ 0 = a */",
          "/* 类比：两个人交换礼物，用纸箱中转——先放进去，再拿出来 */",
          "void swap(int *a, int *b) {",
          "    if (a == b) return;  /* 防止同一个地址异或自己变成 0 */",
          "    *a = *a ^ *b;        /* 第 1 步：a 变成“a 和 b 的异或值” */",
          "    *b = *a ^ *b;        /* 第 2 步：b = (a ^ b) ^ b = a，b 拿到了原来的 a */",
          "    *a = *a ^ *b;        /* 第 3 步：a = (a ^ b) ^ a = b，a 拿到了原来的 b */",
          "}",
          "",
          "",
          "/* ===== 自动生成的测试入口 ===== */",
          "int main(void) {",

          "    int b = 3;",
          "",
          "    printf(\"交换前：a=%d, b=%d\\n\", a, b);",
          "    swap(&a, &b);",
          "    printf(\"交换后：a=%d, b=%d\\n\", a, b);",

        "source": [
          "/* 位图(Bitmap)实现 */",
          "/* 类比：出勤点名册——每个学生一个格子，来了打勾 */",
          "#include <stdio.h>",
          "#include <stdlib.h>",
          "#include <string.h>",
          "",
          "#define MAX_NUM 1000000  /* 最大能存储的数 */",
          "",
          "/* 位图结构 */",
          "typedef struct {",
          "    unsigned char *bits;  /* 位图数组，每个 char 有 8 个 bit */",
          "    int size;             /* 数组大小(字节数) */",
          "    int max;              /* 允许存储的最大数值 */",
          "} Bitmap;",
          "",
          "/* 创建位图 */",
          "/* 参数 max：能存储的最大数值（允许下标为 0..max，共 max + 1 个 bit） */",
          "Bitmap* bitmap_create(int max) {",
          "    if (max < 0) {",
          "        return NULL;",
          "    }",
          "    Bitmap *bm = (Bitmap *)malloc(sizeof(Bitmap));  /* 分配结构体内存 */",
          "    if (bm == NULL) {",
          "        printf(\"位图结构体内存分配失败\\n\");",
          "        return NULL;",
          "    }",
          "    /* 需要的字节数 = 能存 max + 1 个 bit，向上取整 = (max >> 3) + 1 */",
          "    /* 例如：max = 7 需要 1 字节（能存 0-7 共 8 个 bit） */",
          "    /*       max = 8 需要 2 字节（存下标 0-8 共 9 个 bit，1 字节只有 8 位装不下） */",
          "    bm->size = (max >> 3) + 1;",
          "    bm->max = max;",
          "    /* 分配位图数组，calloc 会自动初始化为 0 */",
          "    bm->bits = (unsigned char *)calloc(bm->size, sizeof(unsigned char));",
          "    if (bm->bits == NULL) {",
          "        printf(\"位图数组内存分配失败\\n\");",
          "        free(bm);",
          "        return NULL;",
          "    }",
          "    return bm;",
          "}",
          "",
          "/* 设置第 n 个 bit 为 1（标记 n 存在） */",
          "/* 参数 bm：位图指针；参数 n：要标记的数值 */",
          "void bitmap_set(Bitmap *bm, int n) {",
          "    if (bm == NULL || n < 0 || n > bm->max) return;",
          "    int index = n >> 3;        /* n / 8，找到在第几个字节 */",
          "    int offset = n & 7;        /* n % 8，找到在第几个 bit 位 */",
          "    bm->bits[index] |= (1U << offset);  /* 把对应 bit 置为 1 */",
          "    /* 1U << offset：生成一个只有第 offset 位是 1 的无符号数 */",
          "    /* |=：或操作，把目标 bit 设为 1，不影响其他 bit */",
          "}",
          "",
          "/* 检查第 n 个 bit 是否为 1（检查 n 是否存在） */",
          "int bitmap_get(Bitmap *bm, int n) {",
          "    if (bm == NULL || n < 0 || n > bm->max) return 0;",
          "    int index = n >> 3;        /* n / 8 */",
          "    int offset = n & 7;        /* n % 8 */",
          "    return (bm->bits[index] & (1U << offset)) != 0;",
          "    /* & 操作：如果对应 bit 是 1，结果非 0；是 0，结果为 0 */",
          "}",
          "",
          "/* 清除第 n 个 bit（标记 n 不存在） */",
          "void bitmap_clear(Bitmap *bm, int n) {",
          "    if (bm == NULL || n < 0 || n > bm->max) return;",
          "    int index = n >> 3;        /* n / 8 */",
          "    int offset = n & 7;        /* n % 8 */",
          "    bm->bits[index] &= ~(1U << offset);  /* 把对应 bit 清零 */",
          "    /* ~ (1U << offset)：生成一个只有第 offset 位是 0 的无符号数 */",
          "    /* &=：与操作，把目标 bit 清 0，不影响其他 bit */",
          "}",
          "",
          "/* 释放位图内存 */",
          "void bitmap_destroy(Bitmap *bm) {",
          "    if (bm == NULL) return;",
          "    free(bm->bits);   /* 先释放bits数组 */",
          "    free(bm);         /* 再释放结构体 */",
          "}",
          "",
          "/* 测试代码 */",
          "int main(void) {",
          "    Bitmap *bm = bitmap_create(MAX_NUM);  /* 创建一个能存 100 万个数的位图 */",
          "    if (bm == NULL) {",
          "        return 1;",
          "    }",
          "    ",
          "    /* 模拟出勤记录：学号 1、5、100、999999 来了 */",
          "    bitmap_set(bm, 1);",
          "    bitmap_set(bm, 5);",
          "    bitmap_set(bm, 100);",
          "    bitmap_set(bm, 999999);",
          "    ",
          "    /* 检查出勤情况 */",
          "    printf(\"学号 1 来了吗？%s\\n\", bitmap_get(bm, 1) ? \"来了\" : \"没来\");",
          "    printf(\"学号 2 来了吗？%s\\n\", bitmap_get(bm, 2) ? \"来了\" : \"没来\");",

          "    printf(\"学号 999999 来了吗？%s\\n\", bitmap_get(bm, 999999) ? \"来了\" : \"没来\");",
          "    ",
          "    bitmap_destroy(bm);  /* 释放内存 */",
          "    return 0;",
          "}",

        "source": [
          "/* 布隆过滤器(Bloom Filter)简化实现 */",
          "/* 类比：安检门——\"可能在，肯定不在\" */",
          "#include <stdio.h>",
          "#include <stdlib.h>",
          "#include <string.h>",
          "",
          "#define BLOOM_SIZE 1024   /* 位数组大小（bit 数） */",
          "#define HASH_COUNT 3      /* 哈希函数个数 */",
          "/* 误报率取决于 BLOOM_SIZE、HASH_COUNT 和插入元素数量，工程中要按需求估算参数 */",
          "",
          "/* 布隆过滤器结构 */",
          "typedef struct {",
          "    unsigned char bits[(BLOOM_SIZE + 7) >> 3];  /* 位数组，用 char 数组模拟 */",
          "} BloomFilter;",
          "",
          "/* 简单的哈希函数 1（DJBX33A 变体） */",
          "unsigned int hash1(const char *str) {",
          "    unsigned int hash = 5381;   /* 初始种子 */",
          "    while (*str) {",
          "        hash = ((hash << 5) + hash) + (unsigned char)(*str++);  /* hash * 33 + c */",
          "    }",
          "    return hash % BLOOM_SIZE;   /* 映射到 bit 数组范围内 */",
          "}",
          "",
          "/* 简单的哈希函数 2（另一个种子） */",
          "unsigned int hash2(const char *str) {",
          "    unsigned int hash = 0;",
          "    while (*str) {",
          "        hash = (unsigned char)(*str++) + (hash << 6) + (hash << 16) - hash;",
          "    }",
          "    return hash % BLOOM_SIZE;",
          "}",
          "",
          "/* 简单的哈希函数 3（再换一个种子） */",
          "unsigned int hash3(const char *str) {",
          "    unsigned int hash = 0x12345678;  /* 不同的初始值 */",
          "    while (*str) {",
          "        hash ^= ((hash << 5) + (unsigned char)(*str++) + (hash >> 2));",
          "    }",
          "    return hash % BLOOM_SIZE;",
          "}",
          "",
          "/* 哈希函数数组，方便遍历 */",
          "unsigned int (*hash_funcs[])(const char *) = {hash1, hash2, hash3};",
          "",
          "/* 本例按字节处理字符串。UTF-8 中文会拆成多个字节参与哈希；",
          " * 工程中要先统一编码、大小写和归一化策略。 */",
          "",
          "/* 设置 bit 数组中的某个 bit 为 1 */",
          "static void set_bit(BloomFilter *bf, int pos) {",
          "    bf->bits[pos >> 3] |= (1U << (pos & 7));",
          "}",
          "",
          "/* 检查 bit 数组中的某个 bit 是否为 1 */",
          "static int get_bit(BloomFilter *bf, int pos) {",
          "    return (bf->bits[pos >> 3] & (1U << (pos & 7))) != 0;",
          "}",
          "",
          "/* 初始化布隆过滤器 */",
          "void bloom_init(BloomFilter *bf) {",
          "    memset(bf->bits, 0, sizeof(bf->bits));  /* 全部清零 */",
          "}",
          "",
          "/* 插入元素 */",
          "void bloom_insert(BloomFilter *bf, const char *str) {",
          "    for (int i = 0; i < HASH_COUNT; i++) {",
          "        unsigned int pos = hash_funcs[i](str);  /* 计算哈希位置 */",
          "        set_bit(bf, pos);                        /* 把对应 bit 设为 1 */",
          "    }",
          "}",
          "",
          "/* 查询元素是否存在 */",
          "/* 返回 1 = 可能存在（有假阳性）；返回 0 = 肯定不存在 */",
          "int bloom_contains(BloomFilter *bf, const char *str) {",
          "    for (int i = 0; i < HASH_COUNT; i++) {",
          "        unsigned int pos = hash_funcs[i](str);  /* 计算哈希位置 */",
          "        if (!get_bit(bf, pos)) {                 /* 如果任一 bit 是 0 */",
          "            return 0;                             /* 肯定不存在 */",
          "        }",
          "    }",
          "    return 1;  /* 所有 bit 都是 1，可能存在 */",
          "}",
          "",
          "/* 测试代码 */",
          "int main(void) {",
          "    BloomFilter bf;",
          "    bloom_init(&bf);  /* 初始化 */",
          "    ",
          "    /* 插入一些元素 */",
          "    bloom_insert(&bf, \"苹果\");",
          "    bloom_insert(&bf, \"香蕉\");",
          "    bloom_insert(&bf, \"芒果\");",
          "    ",
          "    /* 查询 */",
          "    printf(\"苹果：%s\\n\", bloom_contains(&bf, \"苹果\") ? \"可能存在\" : \"肯定不存在\");",
          "    printf(\"香蕉：%s\\n\", bloom_contains(&bf, \"香蕉\") ? \"可能存在\" : \"肯定不存在\");",
          "    printf(\"橙子：%s\\n\", bloom_contains(&bf, \"橙子\") ? \"可能存在\" : \"肯定不存在\");",
          "    /* 橙子没有插入过，但可能因为假阳性说“可能存在” */",
          "    ",
          "    return 0;",
          "}",

        "source": [
          "#include <stdio.h>",
          "#include <stdlib.h>",
          "#include <string.h>",
          "",
          "/* 用位运算管理用户权限 */",
          "/* 类比：钥匙扣——每把钥匙开一道门，权限就是钥匙的组合 */",
          "/* 注意：这里为了演示把 READ 放在最低位，和 Unix rwx 中 r = 4, w = 2, x = 1 的编号方向不同 */",
          "",
          "#define PERM_READ    0x01   /* 0001：读权限 */",
          "#define PERM_WRITE   0x02   /* 0010：写权限 */",
          "#define PERM_EXECUTE 0x04   /* 0100：执行权限 */",
          "#define PERM_ADMIN   0x08   /* 1000：管理员权限 */",
          "",
          "/* 检查是否有某项权限 */",
          "/* 用 & 操作：如果对应 bit 是 1，说明有这个权限 */",
          "int has_permission(int user_perm, int perm) {",
          "    return (user_perm & perm) == perm;",
          "}",
          "",
          "/* 添加权限 */",
          "/* 用 | 操作：把对应的 bit 设为 1 */",
          "int add_permission(int user_perm, int perm) {",
          "    return user_perm | perm;",
          "}",
          "",
          "/* 移除权限 */",
          "/* 用 & ~ 操作：把对应的 bit 清 0 */",
          "int remove_permission(int user_perm, int perm) {",
          "    return user_perm & ~perm;",
          "}",
          "",
          "/* 测试 */",
          "int main(void) {",
          "    int user = PERM_READ;  /* 用户初始只有读权限 */",
          "    printf(\"初始权限： %d\\n\", user);",
          "    ",
          "    /* 检查权限 */",
          "    printf(\"有读权限？%s\\n\", has_permission(user, PERM_READ) ? \"是\" : \"否\");",
          "    printf(\"有写权限？%s\\n\", has_permission(user, PERM_WRITE) ? \"是\" : \"否\");",
          "    ",
          "    /* 添加写权限 */",
          "    user = add_permission(user, PERM_WRITE);",
          "    printf(\"添加写权限后： %d\\n\", user);",
          "    printf(\"现在有写权限？%s\\n\", has_permission(user, PERM_WRITE) ? \"是\" : \"否\");",
          "    ",
          "    /* 移除读权限 */",
          "    user = remove_permission(user, PERM_READ);",
          "    printf(\"移除读权限后： %d\\n\", user);",
          "    ",
          "    return 0;",
          "}",

          "",
          "/* 状态压缩 DP 示意（旅行商问题的简化版） */",
          "/* 假设有 4 个城市，编号 0-3 */",
          "",
          "#define MAXN 4           /* 城市数 */",
          "#define INF 0x3f3f3f3f   /* 无穷大，两个 INF 相加也不会溢出 int */",
          "",
          "int dist[MAXN][MAXN] = { /* 距离矩阵 */",
          "    {0, 10, 15, 20},",
          "    {10,  0, 35, 25},",
          "    {15, 35,  0, 30},",
          "    {20, 25, 30,  0}",
          "};",
          "",
          "int dp[1 << MAXN][MAXN];  /* dp[S][i]：已经访问集合 S，当前在城市 i 的最短距离 */",

          "",
          "int tsp(void) {",
          "    int S, full;",
          "    ",
          "    /* 初始化所有状态为无穷大 */",
          "    for (S = 0; S < (1 << MAXN); S++) {",
          "        for (int i = 0; i < MAXN; i++) {",
          "            dp[S][i] = INF;",
          "        }",
          "    }",
          "    ",
          "    /* 起点：从城市 0 出发，状态为 0001 */",
          "    dp[1][0] = 0;  /* 1 = 0001，表示只访问了城市 0 */",
          "    ",
          "    /* 状态转移 */",
          "    full = (1 << MAXN) - 1;  /* 1111，表示所有城市都访问了 */",
          "    ",
          "    for (S = 1; S <= full; S++) {           /* 遍历所有状态 */",
          "        for (int i = 0; i < MAXN; i++) {    /* 当前所在城市 */",
          "            if (dp[S][i] == INF) continue;  /* 这个状态不可达 */",
          "            if (!((S >> i) & 1)) continue;   /* 确认城市 i 在集合 S 中 */",
          "            ",
          "            for (int j = 0; j < MAXN; j++) { /* 尝试去下一个城市 */",
          "                if ((S >> j) & 1) continue;  /* 如果 j 已在集合中，跳过 */",
          "                /* S | (1 << j)：把城市 j 加入访问集合 */",

const firstKey = Object.keys(ALGOS)[0];
const requestedKey = new URLSearchParams(location.search).get('algo');
const savedAtOpen = DHLearning.load();
let currentKey = ALGOS[requestedKey]
  ? requestedKey
  : (savedAtOpen.last && savedAtOpen.last.chapter === CHAPTER_NUM && ALGOS[savedAtOpen.last.algorithm]
      ? savedAtOpen.last.algorithm
      : firstKey);
let currentMode = null;
const engine = new TraceEngine('viz-canvas', 'code-body', 'var-grid', 'callstack');
const tabsEl = document.getElementById('algo-tabs');
const modeTabsEl = document.getElementById('mode-tabs');

function has_modes(algo) {
  return algo && algo.modes && typeof algo.modes === 'object';
}

function mode_label(rawAlgo, mode) {
  const labels = rawAlgo.modeLabels || {};
  if (labels[mode]) return labels[mode];
  if (mode === 'concept') return '理解动画';
  if (mode === 'trace') return '代码执行';
  return mode;
}

function resolve_algo(rawAlgo) {
  if (!has_modes(rawAlgo)) return rawAlgo;
  const mode = currentMode || rawAlgo.defaultMode || Object.keys(rawAlgo.modes)[0];
  return rawAlgo.modes[mode] || rawAlgo.modes[rawAlgo.defaultMode] || Object.values(rawAlgo.modes)[0];
}

function is_concept_algo(algo) {
  if (!algo) return false;
  const classes = algo.var_classes || {};
  if (Object.values(classes).some(info => info && info.type === 'concept')) return true;
  return (algo.steps || []).some(step => step.vars && step.vars.concept);
}

function update_tab_states() {
  const completed = new Set(DHLearning.load().completedDemos);
  tabsEl.querySelectorAll('.algo-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.key === currentKey);
    btn.classList.toggle('completed', completed.has(DHLearning.demoId(CHAPTER_NUM, btn.dataset.key)));
    btn.setAttribute('aria-selected', String(btn.dataset.key === currentKey));
  });
}

function update_chapter_progress() {
  const state = DHLearning.load();
  const completed = new Set(state.completedDemos);
  const keys = Object.keys(ALGOS);
  const done = keys.filter(key => completed.has(DHLearning.demoId(CHAPTER_NUM, key))).length;
  document.getElementById('chapter-progress-text').textContent = `${done} / ${keys.length} 个演示完成`;
  document.getElementById('chapter-progress-fill').style.width = `${keys.length ? done / keys.length * 100 : 0}%`;
  update_tab_states();
}

function render_mode_tabs(rawAlgo) {
  modeTabsEl.innerHTML = '';
  if (!has_modes(rawAlgo)) {
    modeTabsEl.classList.remove('visible');
    currentMode = null;
    return;
  }
  modeTabsEl.classList.add('visible');
  const label = document.createElement('span');
  label.className = 'mode-label';
  label.textContent = '学习方式';
  modeTabsEl.appendChild(label);
  const activeMode = currentMode || rawAlgo.defaultMode || Object.keys(rawAlgo.modes)[0];
  Object.keys(rawAlgo.modes).forEach(mode => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'mode-tab' + (mode === activeMode ? ' active' : '');
    btn.textContent = mode_label(rawAlgo, mode);
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', String(mode === activeMode));
    btn.addEventListener('click', () => {
      if (currentMode === mode) return;
      currentMode = mode;
      load_current_algo(false);
      if (matchMedia('(max-width: 900px)').matches) {
        set_mobile_view(mode === 'trace' ? 'code' : 'animation');
      }
    });
    modeTabsEl.appendChild(btn);
  });
}

function load_current_algo(allowRestore = true) {
  const rawAlgo = ALGOS[currentKey];
  const beforeLoad = DHLearning.load().last;
  if (has_modes(rawAlgo)) {
    const savedMode = beforeLoad && beforeLoad.chapter === CHAPTER_NUM && beforeLoad.algorithm === currentKey
      ? beforeLoad.mode
      : null;
    if (!currentMode) currentMode = savedMode && rawAlgo.modes[savedMode]
      ? savedMode
      : (rawAlgo.defaultMode || Object.keys(rawAlgo.modes)[0]);
  } else {
    currentMode = null;
  }
  render_mode_tabs(rawAlgo);
  const activeAlgo = resolve_algo(rawAlgo);
  document.body.classList.toggle('concept-mode', currentMode === 'concept' || is_concept_algo(activeAlgo));
  engine.stop_play();
  engine.load(activeAlgo);
  try {
    const currentUrl = new URL(location.href);
    currentUrl.searchParams.set('algo', currentKey);
    history.replaceState(null, '', currentUrl.href);
  } catch (_) {
    // file:// 预览环境可能限制 history API，不影响演示本身。
  }
  update_tab_states();

  if (
    allowRestore
    && beforeLoad
    && beforeLoad.chapter === CHAPTER_NUM
    && beforeLoad.algorithm === currentKey
    && beforeLoad.mode === currentMode
    && beforeLoad.step > 0
    && activeAlgo.steps.length
  ) {
    const restoreStep = Math.min(beforeLoad.step, activeAlgo.steps.length - 1);
    requestAnimationFrame(() => engine.go_to_step(restoreStep));
  }
}

Object.entries(ALGOS).forEach(([key, algo]) => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'algo-tab';
  btn.dataset.key = key;
  btn.textContent = algo.title;
  btn.setAttribute('role', 'tab');
  btn.setAttribute('aria-selected', String(key === currentKey));
  btn.addEventListener('click', () => {
    if (currentKey === key) return;
    currentKey = key;
    currentMode = has_modes(algo) ? (algo.defaultMode || Object.keys(algo.modes)[0]) : null;
    load_current_algo(true);
  });
  tabsEl.appendChild(btn);
});

document.addEventListener('dh:stepchange', event => {
  const detail = event.detail || {};
  DHLearning.updateLast(CHAPTER_NUM, currentKey, currentMode, detail.currentStep);
  if (detail.atEnd) DHLearning.markDemoComplete(CHAPTER_NUM, currentKey);
  update_chapter_progress();
});

document.getElementById('btn-play').addEventListener('click', () => engine.playing ? engine.stop_play() : engine.start_play());
document.getElementById('btn-step').addEventListener('click', () => { engine.stop_play(); engine.step_forward(); });
document.getElementById('btn-reset').addEventListener('click', () => engine.reset());
document.getElementById('btn-back').addEventListener('click', () => { engine.stop_play(); engine.step_backward(); });
document.getElementById('btn-to-bp').addEventListener('click', () => { engine.stop_play(); engine.play_to_bp(); });

const speedSlider = document.getElementById('speed-slider');
const savedSpeed = localStorage.getItem('dh_speed');
if (savedSpeed !== null) speedSlider.value = savedSpeed;
speedSlider.setAttribute('aria-valuetext', `速度 ${speedSlider.value}`);
speedSlider.addEventListener('input', () => {
  localStorage.setItem('dh_speed', speedSlider.value);
  speedSlider.setAttribute('aria-valuetext', `速度 ${speedSlider.value}`);
  if (engine.playing) { clearTimeout(engine.playTimer); engine._play_loop(); }
});
speedSlider.addEventListener('keydown', event => {
  if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
  event.preventDefault();
  event.stopPropagation();
  const direction = event.key === 'ArrowRight' ? 1 : -1;
  speedSlider.value = String(Math.max(Number(speedSlider.min), Math.min(Number(speedSlider.max), Number(speedSlider.value) + direction)));
  speedSlider.dispatchEvent(new Event('input', { bubbles: true }));
});
document.getElementById('font-dec').addEventListener('click', () => engine.font_dec());
document.getElementById('font-inc').addEventListener('click', () => engine.font_inc());

document.addEventListener('keydown', event => {
  const target = event.target;
  if (target && target.closest && target.closest('button,input,select,textarea,a,summary,[contenteditable="true"]')) return;
  if (event.key === ' ') {
    event.preventDefault();
    engine.playing ? engine.stop_play() : engine.start_play();
  } else if (event.key === 'ArrowRight') {
    event.preventDefault();
    engine.stop_play();
    engine.step_forward();
  } else if (event.key === 'ArrowLeft') {
    event.preventDefault();
    engine.stop_play();
    engine.step_backward();
  } else if (event.key.toLowerCase() === 'r' && !event.metaKey && !event.ctrlKey && !event.altKey) {
    engine.reset();
  }
});

function set_mobile_view(view) {
  document.body.dataset.mobileView = view;
  document.querySelectorAll('.mobile-view-switcher button').forEach(btn => {
    const active = btn.dataset.mobileView === view;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-selected', String(active));
  });
  if (view === 'animation' && engine.currentStep >= 0) {
    requestAnimationFrame(() => engine.go_to_step(engine.currentStep));
  }
}

document.querySelectorAll('.mobile-view-switcher button').forEach(btn => {
  btn.addEventListener('click', () => set_mobile_view(btn.dataset.mobileView));
});

DHLearning.visitChapter(CHAPTER_NUM);
update_chapter_progress();
load_current_algo(true);
</script>
