        "source": [
          "/* 滑动窗口：长度最小的子数组 */",
          "/* 总和>=target的最短连续子数组长度 */",
          "/* 类比：火车车窗看风景——窗口不断滑动，找到最佳视角 */",
          "#include <stdio.h>",
          "#include <limits.h>",
          "",
          "/* 返回总和>=target的最短子数组长度 */",
          "/* 如果不存在返回0 */",
          "int min_subarray_len(long long target, int nums[], int n) {",
          "    int left = 0;              /* 窗口左边界 */",
          "    long long window_sum = 0;  /* 当前窗口内的元素和，用long long防溢出 */",
          "    int min_len = INT_MAX;     /* 记录最小长度，初始化为最大值 */",
          "    ",
          "    /* right从0开始，不断向右扩展 */",
          "    for (int right = 0; right < n; right++) {",
          "        /* 第1步：把新元素加入窗口 */",
          "        window_sum += nums[right];",
          "        ",
          "        /* 第2步：当窗口和>=target时，尝试收缩左边界 */",
          "        while (window_sum >= target) {",
          "            /* 当前窗口已经满足条件，先更新最小长度 */",
          "            int current_len = right - left + 1;",
          "            if (current_len < min_len) {",
          "                min_len = current_len;",
          "            }",
          "            /* 再收缩左边界：把左边的元素移出窗口 */",
          "            window_sum -= nums[left];",
          "            left++;",
          "        }",
          "        /* 第3步：如果窗口和<target，继续扩展right（for循环自动处理） */",
          "    }",
          "    ",
          "    /* 如果没找到，返回0 */",
          "    return (min_len == INT_MAX) ? 0 : min_len;",
          "}",
          "",
          "int main() {",
          "    int nums[] = {2, 3, 1, 2, 4, 3};",
          "    int n = 6;",
          "    long long target = 7;",
          "    ",
          "    int result = min_subarray_len(target, nums, n);",
          "    printf(\"总和>= %lld 的最短子数组长度： %d\\n\", target, result);",
          "    /* 输出： 2 */",
          "    ",
          "    return 0;",
          "}",

          "/* 双指针（左右指针）：有序数组两数之和 */",
          "/* 类比：两个人从走廊两头往中间走 */",
          "#include <stdio.h>",
          "",
          "/* 在有序数组中找到两个数，使它们的和等于target */",
          "/* 返回两个数的下标，存入result数组 */",
          "/* 如果找不到，返回0 */",
          "int two_sum_sorted(int nums[], int n, int target, int result[2]) {",
          "    int left = 0;         /* 左指针，从头开始 */",
          "    int right = n - 1;    /* 右指针，从尾开始 */",
          "    ",
          "    while (left < right) {  /* 两个指针还没相遇 */",
          "        long long sum = (long long)nums[left] + nums[right];",
          "        ",
          "        if (sum == target) {",
          "            /* 找到了！ */",
          "            result[0] = left;",
          "            result[1] = right;",
          "            return 1;  /* 返回成功 */",
          "        } else if (sum < target) {",
          "            /* 和太小了，需要更大的数 */",
          "            /* 数组是升序的，left++会让和变大 */",
          "            left++;",
          "        } else {",
          "            /* 和太大了，需要更小的数 */",
          "            /* right--会让和变小 */",
          "            right--;",
          "        }",
          "    }",
          "    ",
          "    return 0;  /* 没找到 */",
          "}",
          "",

          "    int n = 4;",

          "    } else {",

          "    }",
          "    ",
          "    return 0;",

        "source": [
          "#include <stdio.h>",
          "#include <stdlib.h>",
          "",
          "struct ListNode {",
          "    int val;",
          "    struct ListNode *next;",
          "};",
          "",
          "/* 快慢指针变体一：寻找链表的中点 */",
          "struct ListNode *find_middle(struct ListNode *head) {",
          "    struct ListNode *slow = head;",
          "    struct ListNode *fast = head;",
          "    while (fast != NULL && fast->next != NULL) {",
          "        slow = slow->next;",
          "        fast = fast->next->next;",
          "    }",
          "    return slow;  /* fast到末尾时，slow正好在中点 */",
          "}",
          "",
          "/* 快慢指针变体二：寻找倒数第k个节点 */",
          "struct ListNode *find_kth_from_end(struct ListNode *head, int k) {",
          "    struct ListNode *fast = head;",
          "    struct ListNode *slow = head;",
          "    /* fast先出发k步 */",
          "    for (int i = 0; i < k; i++) {",
          "        if (fast == NULL) return NULL;  /* k超过链表长度 */",
          "        fast = fast->next;",
          "    }",
          "    /* 两人同速走到底 */",
          "    while (fast != NULL) {",
          "        slow = slow->next;",
          "        fast = fast->next;",
          "    }",
          "    return slow;  /* fast到末尾时，slow在倒数第k个 */",
          "}",
          "",
          "/* 测试：快慢指针 */",
          "int main() {",
          "    /* 构建链表 1 → 2 → 3 → 4 → 5 → NULL */",
          "    struct ListNode nodes[5];",
          "    for (int i = 0; i < 5; i++) {",
          "        nodes[i].val = i + 1;",
          "        nodes[i].next = (i < 4) ? &nodes[i+1] : NULL;",
          "    }",
          "",
          "    struct ListNode *mid = find_middle(&nodes[0]);",
          "    printf(\"链表中点：%d（期望 3）\\n\", mid->val);",
          "",
          "    struct ListNode *kth = find_kth_from_end(&nodes[0], 2);",
          "    printf(\"倒数第2个：%d（期望 4）\\n\", kth->val);",
          "",
          "    kth = find_kth_from_end(&nodes[0], 1);",
          "    printf(\"倒数第1个：%d（期望 5）\\n\", kth->val);",
          "",
          "    return 0;",
          "}",

        "source": [
          "/* 三数之和：找出所有和为0的三元组 */",
          "/* 固定一个数 + 双指针找另外两个 */",
          "#include <stdio.h>",
          "#include <stdlib.h>",
          "",
          "/* 比较函数，用于qsort排序 */",
          "int compare(const void *a, const void *b) {",
          "    int x = *(int *)a, y = *(int *)b;",
          "    if (x < y) return -1;",
          "    if (x > y) return 1;",
          "    return 0;",
          "}",
          "",
          "/* 三数之和 */",
          "/* 结果存入results数组，返回找到的三元组个数 */",
          "/* max_results用于防止结果数组越界 */",
          "int three_sum(int nums[], int n, int results[][3], int max_results) {",
          "    int count = 0;  /* 结果计数 */",
          "    ",
          "    /* 第1步：排序 */",
          "    qsort(nums, n, sizeof(int), compare);",
          "    ",
          "    /* 第2步：遍历每个元素作为第一个数 */",
          "    for (int i = 0; i < n - 2; i++) {",
          "        /* 剪枝：如果当前数>0，后面的数都更大，不可能和为0 */",
          "        if (nums[i] > 0) break;",
          "        ",
          "        /* 跳过重复的第一个数 */",
          "        if (i > 0 && nums[i] == nums[i - 1]) continue;",
          "        ",
          "        /* 第3步：双指针找另外两个数 */",
          "        int left = i + 1;       /* 左指针从i+1开始 */",
          "        int right = n - 1;      /* 右指针从末尾开始 */",
          "        ",
          "        while (left < right) {",
          "            /* 三个int连加极易整数溢出。严谨做法是转long long再判断。",
          "             * 只需把第一个操作数强转为long long，后两个会自动提升，避免中间结果溢出。",
          "             * 面试白板上写出这种防溢出细节，面试官会对你的工程素养刮目相看。 */",
          "            long long sum = (long long)nums[i] + (long long)nums[left] + (long long)nums[right];",
          "            ",
          "            if (sum == 0) {",
          "                /* 找到了一个三元组 */",
          "                if (count < max_results) {",
          "                    results[count][0] = nums[i];",
          "                    results[count][1] = nums[left];",
          "                    results[count][2] = nums[right];",
          "                    count++;",
          "                } else {",
          "                    return count;  /* 结果数组满了，避免越界 */",
          "                }",
          "                ",
          "                /* 跳过重复的左指针元素 */",
          "                while (left < right && nums[left] == nums[left + 1]) left++;",
          "                /* 跳过重复的右指针元素 */",
          "                while (left < right && nums[right] == nums[right - 1]) right--;",
          "                ",
          "                /* 同时移动两个指针 */",
          "                left++;",
          "                right--;",
          "            } else if (sum < 0) {",
          "                /* 和太小，左指针右移 */",
          "                left++;",
          "            } else {",
          "                /* 和太大，右指针左移 */",
          "                right--;",
          "            }",
          "        }",
          "    }",
          "    ",
          "    return count;",
          "}",
          "",
          "int main() {",
          "    int nums[] = {-1, 0, 1, 2, -1, -4};",
          "    int n = 6;",
          "    int results[100][3];  /* 存放结果 */",
          "    int max_results = sizeof(results) / sizeof(results[0]);",
          "    int count, i;",
          "    ",
          "    count = three_sum(nums, n, results, max_results);",
          "    ",
          "    printf(\"和为0的三元组：\\n\");",
          "    for (i = 0; i < count; i++) {",
          "        printf(\"[%d, %d, %d]\\n\", results[i][0], results[i][1], results[i][2]);",
          "    }",
          "    ",
          "    return 0;",
          "}",

        "source": [
          "/* 单调栈：下一个更大元素 */",
          "/* 类比：排队时等待右边第一个比自己高的人 */",
          "#include <stdio.h>",
          "",
          "#define MAXN 1000",
          "",
          "/* 找每个元素右边第一个比它大的元素 */",
          "/* 结果存入result数组 */",
          "void next_greater_element(int nums[], int n, int result[]) {",
          "    int stack[MAXN];    /* 栈，存放下标（不是存值！） */",
          "    int top = -1;       /* 栈顶指针，-1表示栈空 */",
          "",
          "    /* 示例代码用固定数组，真实工程中可改成动态分配 */",
          "    if (n > MAXN) {",
          "        return;",
          "    }",
          "    ",
          "    /* 初始化结果数组为-1 */",
          "    for (int i = 0; i < n; i++) {",
          "        result[i] = -1;",
          "    }",
          "    ",
          "    /* 从左往右遍历：当前元素可能成为前面某些元素的答案 */",
          "    for (int i = 0; i < n; i++) {",
          "        /* 当前元素比栈顶元素更大时，栈顶元素的答案就是当前元素 */",
          "        while (top >= 0 && nums[i] > nums[stack[top]]) {",
          "            result[stack[top]] = nums[i];",
          "            top--;  /* 栈顶元素已经找到答案，弹出 */",
          "        }",
          "        ",
          "        /* 当前下标入栈，等待未来更大的元素 */",
          "        top++;",
          "        stack[top] = i;",
          "    }",
          "}",
          "",
          "int main() {",
          "    int nums[] = {2, 1, 2, 4, 3};",
          "    int n = 5;",
          "    int result[5];",
          "    ",
          "    next_greater_element(nums, n, result);",
          "    ",
          "    printf(\"下一个更大元素：\\n\");",
          "    for (int i = 0; i < n; i++) {",
          "        printf(\"nums[%d]=%d -> %d\\n\", i, nums[i], result[i]);",
          "    }",
          "    ",
          "    return 0;",
          "}",

          "/* 前缀和：快速查询任意区间的和 */",
          "/* 类比：记账——每天的余额就是前缀和 */",
          "#include <stdio.h>",
          "",
          "/* 构建前缀和数组 */",
          "/* prefix_sum[i] = nums[0] + nums[1] + ... + nums[i-1] */",
          "/* 注意：prefix_sum[0] = 0，方便计算 */",
          "void build_prefix_sum(int nums[], int n, long long prefix_sum[]) {",
          "    prefix_sum[0] = 0;  /* 哨兵：前0个元素的和是0 */",
          "    for (int i = 0; i < n; i++) {",
          "        prefix_sum[i + 1] = prefix_sum[i] + nums[i];",
          "    }",
          "}",
          "",
          "/* 查询区间[left, right]的和（闭区间） */",
          "/* 时间复杂度：$O(1)$！ */",
          "long long range_sum(long long prefix_sum[], int left, int right) {",
          "    return prefix_sum[right + 1] - prefix_sum[left];",
          "}",
          "",
          "int main() {",
          "    int nums[] = {1, 2, 3, 4, 5};",
          "    int n = 5;",
          "    long long prefix_sum[6];  /* n+1个元素，第0个是哨兵 */",

        "source": [
          "/* 差分数组：快速对区间进行批量加减操作 */",
          "/* 类比：每天的收支记录——修改收支比修改余额方便 */",
          "",
          "#include <stdio.h>",
          "",
          "/* 构建差分数组 */",
          "/* diff[i] = nums[i] - nums[i-1] */",
          "/* diff[0] = nums[0] */",
          "void build_diff_array(int nums[], int n, long long diff[]) {",
          "    if (n <= 0) return;",
          "    diff[0] = nums[0];",
          "    for (int i = 1; i < n; i++) {",
          "        diff[i] = (long long)nums[i] - nums[i - 1];",
          "    }",
          "}",
          "",
          "/* 对区间[left, right]的所有元素加上val */",
          "/* 只需要修改diff[left]和diff[right+1]两个位置！ */",
          "void range_add(long long diff[], int n, int left, int right, long long val) {",
          "    if (left < 0 || right >= n || left > right) return;  /* 简单防御 */",
          "    diff[left] += val;           /* left位置开始加val */",
          "    if (right + 1 < n) {",
          "        diff[right + 1] -= val;  /* right+1位置减去val，抵消前面的加 */",
          "    }",
          "}",
          "",
          "/* 从差分数组还原原始数组（对差分数组求前缀和） */",
          "void restore_array(long long diff[], int n, long long result[]) {",
          "    if (n <= 0) return;",
          "    result[0] = diff[0];",
          "    for (int i = 1; i < n; i++) {",
          "        result[i] = result[i - 1] + diff[i];",
          "    }",
          "}",
          "",
          "int main() {",
          "    int nums[] = {1, 2, 3, 4, 5};",
          "    int n = 5;",
          "    long long diff[5];",
          "    long long result[5];",
          "    ",
          "    build_diff_array(nums, n, diff);",
          "    ",
          "    /* 对区间[1, 3]的所有元素加10 */",
          "    /* 原始数组变成：[1, 12, 13, 14, 5] */",
          "    range_add(diff, n, 1, 3, 10);",
          "    ",
          "    /* 还原数组 */",
          "    restore_array(diff, n, result);",
          "    ",
          "    printf(\"修改后： \");",
          "    for (int i = 0; i < n; i++) {",
          "        printf(\"%lld \", result[i]);",
          "    }",
          "    printf(\"\\n\");",

const firstKey = Object.keys(ALGOS)[0];
const requestedKey = new URLSearchParams(location.search).get('algo');
const savedAtOpen = DHLearning.load();
let currentKey = ALGOS[requestedKey]
  ? requestedKey
  : (savedAtOpen.last && savedAtOpen.last.chapter === CHAPTER_NUM && ALGOS[savedAtOpen.last.algorithm]
      ? savedAtOpen.last.algorithm
      : firstKey);
let currentMode = null;
const engine = new TraceEngine('viz-canvas', 'code-body', 'var-grid', 'callstack');
const tabsEl = document.getElementById('algo-tabs');
const modeTabsEl = document.getElementById('mode-tabs');

function has_modes(algo) {
  return algo && algo.modes && typeof algo.modes === 'object';
}

function mode_label(rawAlgo, mode) {
  const labels = rawAlgo.modeLabels || {};
  if (labels[mode]) return labels[mode];
  if (mode === 'concept') return '理解动画';
  if (mode === 'trace') return '代码执行';
  return mode;
}

function resolve_algo(rawAlgo) {
  if (!has_modes(rawAlgo)) return rawAlgo;
  const mode = currentMode || rawAlgo.defaultMode || Object.keys(rawAlgo.modes)[0];
  return rawAlgo.modes[mode] || rawAlgo.modes[rawAlgo.defaultMode] || Object.values(rawAlgo.modes)[0];
}

function is_concept_algo(algo) {
  if (!algo) return false;
  const classes = algo.var_classes || {};
  if (Object.values(classes).some(info => info && info.type === 'concept')) return true;
  return (algo.steps || []).some(step => step.vars && step.vars.concept);
}

function update_tab_states() {
  const completed = new Set(DHLearning.load().completedDemos);
  tabsEl.querySelectorAll('.algo-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.key === currentKey);
    btn.classList.toggle('completed', completed.has(DHLearning.demoId(CHAPTER_NUM, btn.dataset.key)));
    btn.setAttribute('aria-selected', String(btn.dataset.key === currentKey));
  });
}

function update_chapter_progress() {
  const state = DHLearning.load();
  const completed = new Set(state.completedDemos);
  const keys = Object.keys(ALGOS);
  const done = keys.filter(key => completed.has(DHLearning.demoId(CHAPTER_NUM, key))).length;
  document.getElementById('chapter-progress-text').textContent = `${done} / ${keys.length} 个演示完成`;
  document.getElementById('chapter-progress-fill').style.width = `${keys.length ? done / keys.length * 100 : 0}%`;
  update_tab_states();
}

function render_mode_tabs(rawAlgo) {
  modeTabsEl.innerHTML = '';
  if (!has_modes(rawAlgo)) {
    modeTabsEl.classList.remove('visible');
    currentMode = null;
    return;
  }
  modeTabsEl.classList.add('visible');
  const label = document.createElement('span');
  label.className = 'mode-label';
  label.textContent = '学习方式';
  modeTabsEl.appendChild(label);
  const activeMode = currentMode || rawAlgo.defaultMode || Object.keys(rawAlgo.modes)[0];
  Object.keys(rawAlgo.modes).forEach(mode => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'mode-tab' + (mode === activeMode ? ' active' : '');
    btn.textContent = mode_label(rawAlgo, mode);
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', String(mode === activeMode));
    btn.addEventListener('click', () => {
      if (currentMode === mode) return;
      currentMode = mode;
      load_current_algo(false);
      if (matchMedia('(max-width: 900px)').matches) {
        set_mobile_view(mode === 'trace' ? 'code' : 'animation');
      }
    });
    modeTabsEl.appendChild(btn);
  });
}

function load_current_algo(allowRestore = true) {
  const rawAlgo = ALGOS[currentKey];
  const beforeLoad = DHLearning.load().last;
  if (has_modes(rawAlgo)) {
    const savedMode = beforeLoad && beforeLoad.chapter === CHAPTER_NUM && beforeLoad.algorithm === currentKey
      ? beforeLoad.mode
      : null;
    if (!currentMode) currentMode = savedMode && rawAlgo.modes[savedMode]
      ? savedMode
      : (rawAlgo.defaultMode || Object.keys(rawAlgo.modes)[0]);
  } else {
    currentMode = null;
  }
  render_mode_tabs(rawAlgo);
  const activeAlgo = resolve_algo(rawAlgo);
  document.body.classList.toggle('concept-mode', currentMode === 'concept' || is_concept_algo(activeAlgo));
  engine.stop_play();
  engine.load(activeAlgo);
  try {
    const currentUrl = new URL(location.href);
    currentUrl.searchParams.set('algo', currentKey);
    history.replaceState(null, '', currentUrl.href);
  } catch (_) {
    // file:// 预览环境可能限制 history API，不影响演示本身。
  }
  update_tab_states();

  if (
    allowRestore
    && beforeLoad
    && beforeLoad.chapter === CHAPTER_NUM
    && beforeLoad.algorithm === currentKey
    && beforeLoad.mode === currentMode
    && beforeLoad.step > 0
    && activeAlgo.steps.length
  ) {
    const restoreStep = Math.min(beforeLoad.step, activeAlgo.steps.length - 1);
    requestAnimationFrame(() => engine.go_to_step(restoreStep));
  }
}

Object.entries(ALGOS).forEach(([key, algo]) => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'algo-tab';
  btn.dataset.key = key;
  btn.textContent = algo.title;
  btn.setAttribute('role', 'tab');
  btn.setAttribute('aria-selected', String(key === currentKey));
  btn.addEventListener('click', () => {
    if (currentKey === key) return;
    currentKey = key;
    currentMode = has_modes(algo) ? (algo.defaultMode || Object.keys(algo.modes)[0]) : null;
    load_current_algo(true);
  });
  tabsEl.appendChild(btn);
});

document.addEventListener('dh:stepchange', event => {
  const detail = event.detail || {};
  DHLearning.updateLast(CHAPTER_NUM, currentKey, currentMode, detail.currentStep);
  if (detail.atEnd) DHLearning.markDemoComplete(CHAPTER_NUM, currentKey);
  update_chapter_progress();
});

document.getElementById('btn-play').addEventListener('click', () => engine.playing ? engine.stop_play() : engine.start_play());
document.getElementById('btn-step').addEventListener('click', () => { engine.stop_play(); engine.step_forward(); });
document.getElementById('btn-reset').addEventListener('click', () => engine.reset());
document.getElementById('btn-back').addEventListener('click', () => { engine.stop_play(); engine.step_backward(); });
document.getElementById('btn-to-bp').addEventListener('click', () => { engine.stop_play(); engine.play_to_bp(); });

const speedSlider = document.getElementById('speed-slider');
const savedSpeed = localStorage.getItem('dh_speed');
if (savedSpeed !== null) speedSlider.value = savedSpeed;
speedSlider.setAttribute('aria-valuetext', `速度 ${speedSlider.value}`);
speedSlider.addEventListener('input', () => {
  localStorage.setItem('dh_speed', speedSlider.value);
  speedSlider.setAttribute('aria-valuetext', `速度 ${speedSlider.value}`);
  if (engine.playing) { clearTimeout(engine.playTimer); engine._play_loop(); }
});
speedSlider.addEventListener('keydown', event => {
  if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
  event.preventDefault();
  event.stopPropagation();
  const direction = event.key === 'ArrowRight' ? 1 : -1;
  speedSlider.value = String(Math.max(Number(speedSlider.min), Math.min(Number(speedSlider.max), Number(speedSlider.value) + direction)));
  speedSlider.dispatchEvent(new Event('input', { bubbles: true }));
});
document.getElementById('font-dec').addEventListener('click', () => engine.font_dec());
document.getElementById('font-inc').addEventListener('click', () => engine.font_inc());

document.addEventListener('keydown', event => {
  const target = event.target;
  if (target && target.closest && target.closest('button,input,select,textarea,a,summary,[contenteditable="true"]')) return;
  if (event.key === ' ') {
    event.preventDefault();
    engine.playing ? engine.stop_play() : engine.start_play();
  } else if (event.key === 'ArrowRight') {
    event.preventDefault();
    engine.stop_play();
    engine.step_forward();
  } else if (event.key === 'ArrowLeft') {
    event.preventDefault();
    engine.stop_play();
    engine.step_backward();
  } else if (event.key.toLowerCase() === 'r' && !event.metaKey && !event.ctrlKey && !event.altKey) {
    engine.reset();
  }
});

function set_mobile_view(view) {
  document.body.dataset.mobileView = view;
  document.querySelectorAll('.mobile-view-switcher button').forEach(btn => {
    const active = btn.dataset.mobileView === view;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-selected', String(active));
  });
  if (view === 'animation' && engine.currentStep >= 0) {
    requestAnimationFrame(() => engine.go_to_step(engine.currentStep));
  }
}

document.querySelectorAll('.mobile-view-switcher button').forEach(btn => {
  btn.addEventListener('click', () => set_mobile_view(btn.dataset.mobileView));
});

DHLearning.visitChapter(CHAPTER_NUM);
update_chapter_progress();
load_current_algo(true);
</script>
</body>
