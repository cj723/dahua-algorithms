          "        int child = 2 * k + 1;",
          "        if (child + 1 < pq->size && ",
          "            pq->data[child + 1]->ub > pq->data[child]->ub) {",
          "            child++;",
          "        }",
          "        if (pq->data[k]->ub < pq->data[child]->ub) {",
          "            Node *tmp = pq->data[k];",
          "            pq->data[k] = pq->data[child];",
          "            pq->data[child] = tmp;",
          "            k = child;",
          "        } else {",
          "            break;",
          "        }",
          "    }",
          "}",
          "",
          "void pq_push(PriorityQueue *pq, Node *node) {",
          "    if (pq->size >= MAX_ITEMS * MAX_ITEMS) {",
          "        printf(\"优先队列溢出！节点数超过上限。\\n\");",
          "        free(node);",
          "        return;",
          "    }",
          "    pq->data[pq->size] = node;",
          "    pq_swim(pq, pq->size);",
          "    pq->size++;",
          "}",
          "",
          "Node *pq_pop(PriorityQueue *pq) {",
          "    Node *top = pq->data[0];",
          "    pq->size--;",
          "    pq->data[0] = pq->data[pq->size];",
          "    pq_sink(pq, 0);",
          "    return top;",
          "}",
          "",
          "int pq_empty(PriorityQueue *pq) {",
          "    return pq->size == 0;",
          "}",
          "",
          "/* ===== 限界函数：计算上界 ===== */",
          "/*",
          " * 核心思想：只为估算上界时，允许把装不下的物品按比例\"切开\"。",
          " * 注意：物品必须已经按单位价值从高到低排序。",
          " */",
          "double calc_ub(int n, Item items[], int level, double cur_weight, ",
          "               double cur_value, double capacity) {",
          "    double remain = capacity - cur_weight;",
          "    double ub = cur_value;",
          "    ",
          "    /* 贪心地从当前物品开始往后装（前提：物品已按单位价值降序排好） */",
          "    for (int i = level; i < n; i++) {",
          "        if (remain <= 0) break; /* 背包满了，结束 */",
          "        if (items[i].weight <= remain) {",
          "            /* 整个装得下 */",
          "            ub += items[i].value;",
          "            remain -= items[i].weight;",
          "        } else {",
          "            /* 整个装不下，就按比例切开，只为估算上界 */",
          "            ub += items[i].value * (remain / items[i].weight);",
          "            remain = 0;",
          "        }",
          "    }",
          "    return ub;",
          "}",
          "",
          "/* ===== 主算法 ===== */",
          "int knapsack_bb(int n, Item items[], double capacity, ",
          "                int best_selected[]) {",
          "    PriorityQueue pq;",
          "    pq_init(&pq);",
          "    ",
          "    double best_value = 0;  /* 当前已经找到的真实最优解 */",
          "    ",
          "    /* 1. 初始化根节点（什么都还没装） */",
          "    Node *root = (Node *)calloc(1, sizeof(Node));",
          "    if (root == NULL) {",
          "        return 0;",
          "    }",
          "    root->level = 0;",
          "    root->weight = 0;",
          "    root->value = 0;",
          "    root->ub = calc_ub(n, items, 0, 0, 0, capacity);",
          "    pq_push(&pq, root);",
          "    ",
          "    /* 2. 只要队列不空，就一直探索 */",
          "    while (!pq_empty(&pq)) {",
          "        Node *cur = pq_pop(&pq); /* 永远先看\"上界最大\"的节点 */",
          "        ",
          "        /* [核心剪枝]：如果这个节点理论上的最好结果，都不如当前最优解，直接丢掉 */",
          "        if (cur->ub <= best_value) {",
          "            free(cur);",
          "            continue;",
          "        }",
          "        ",
          "        /* 所有物品都已经决策完了 */",
          "        if (cur->level == n) {",
          "            if (cur->value > best_value) {",
          "                best_value = cur->value;",
          "                memcpy(best_selected, cur->selected, n * sizeof(int));",
          "            }",
          "            free(cur);",
          "            continue;",
          "        }",
          "        ",
          "        int i = cur->level; /* 准备决策第 i 个物品 */",
          "        ",
          "        /* ===== 分支 A：选择第 i 个物品（前提是装得下） ===== */",
          "        if (cur->weight + items[i].weight <= capacity) {",
          "            Node *yes = (Node *)malloc(sizeof(Node));",
          "            if (yes == NULL) {",
          "                free(cur);",
          "                break;",
          "            }",
          "            memcpy(yes, cur, sizeof(Node));",
          "            yes->level = cur->level + 1;",
          "            yes->weight = cur->weight + items[i].weight;",
          "            yes->value = cur->value + items[i].value;",
          "            yes->selected[i] = 1;",
          "            yes->ub = calc_ub(n, items, yes->level, ",
          "                             yes->weight, yes->value, capacity);",
          "            ",
          "            /* 只有\"理论最好成绩\"仍有希望超过当前最优解，才继续探索 */",
          "            if (yes->ub > best_value) {",
          "                pq_push(&pq, yes);",
          "            } else {",
          "                free(yes);",
          "            }",
          "        }",
          "        ",
          "        /* ===== 分支 B：不选择第 i 个物品 ===== */",
          "        Node *no = (Node *)malloc(sizeof(Node));",
          "        if (no == NULL) {",
          "            free(cur);",
          "            break;",
          "        }",
          "        memcpy(no, cur, sizeof(Node));",
          "        no->level = cur->level + 1;",
          "        no->selected[i] = 0;",
          "        no->ub = calc_ub(n, items, no->level, ",
          "                         no->weight, no->value, capacity);",
          "        ",
          "        if (no->ub > best_value) {",
          "            pq_push(&pq, no);",
          "        } else {",
          "            free(no);",
          "        }",
          "        ",
          "        free(cur); /* 当前节点使命完成 */",
          "    }",
          "    ",
          "    /* 清空优先队列中残留的节点（防内存泄漏） */",
          "    while (!pq_empty(&pq)) {",
          "        free(pq_pop(&pq));",
          "    }",
          "    ",
          "    return (int)best_value;",
          "}",
          "",
          "/* 工程注意：优先队列生产环境建议用堆替代定长数组 */",
          "",
          "/* ===== 主函数 ===== */",
          "int main(void) {",
          "    int n = 4;",
          "    Item items[] = {",
          "        {1, 2, 10, 0},",
          "        {2, 4, 10, 0},",
          "        {3, 6, 12, 0},",
          "        {4, 9, 18, 0}",
          "    };",
          "    double capacity = 15;",
          "    ",
          "    /* 计算单位价值并排序 */",
          "    for (int i = 0; i < n; i++) {",
          "        items[i].ratio = items[i].value / items[i].weight;",
          "    }",
          "    qsort(items, n, sizeof(Item), cmp_ratio);",
          "    ",
          "    printf(\"按单位价值排序后的物品：\\n\");",
          "    printf(\"%-6s %-8s %-8s %-10s\\n\", \"编号\", \"重量\", \"价值\", \"单价\");",
          "    for (int i = 0; i < n; i++) {",
          "        printf(\"%-6d %-8.0f %-8.0f %-10.2f\\n\", ",
          "               items[i].id, items[i].weight, ",
          "               items[i].value, items[i].ratio);",
          "    }",
          "    printf(\"\\n\");",
          "    ",
          "    int best_selected[MAX_ITEMS] = {0};",
          "    int max_val = knapsack_bb(n, items, capacity, best_selected);",
          "    ",
          "    printf(\"最优解：\\n\");",
          "    printf(\"最大价值：%d 万元\\n\", max_val);",
          "    printf(\"选择的物品：\");",
          "    double total_weight = 0;",
          "    for (int i = 0; i < n; i++) {",
          "        if (best_selected[i]) {",
          "            printf(\"物品%d(%.0fkg, %.0f万) \", ",
          "                   items[i].id, items[i].weight, items[i].value);",
          "            total_weight += items[i].weight;",
          "        }",
          "    }",
          "    printf(\"\\n总重量：%.0f kg / %.0f kg\\n\", total_weight, capacity);",
          "    ",
          "    return 0;",
          "}",
          ""
        ],

          "#include <stdio.h>",
          "#include <stdlib.h>",
          "#include <string.h>",
          "",
          "#define MAX_N 20",
          "#define INF 1000000000.0",
          "",
          "int n;                          /* 城市数量 */",
          "double dist[MAX_N][MAX_N];      /* 距离矩阵 */",
          "",
          "/* 搜索节点（核心状态） */",
          "typedef struct {",
          "    int level;                  /* 已访问的城市数 */",
          "    int path[MAX_N];            /* 当前路线，例如 0 -> 3 -> 2 */",
          "    int visited[MAX_N];         /* visited[i] = 1 表示城市 i 已访问 */",
          "    double cost;                /* 当前已经走过的真实距离 */",
          "    double lb;                  /* 理论下界（Lower Bound） */",
          "} Node;",
          "",
          "/* 优先队列（最小堆，按下界排序——TSP求最小值） */",
          "typedef struct {",
          "    Node *data[100000];",
          "    int size;",
          "} PriorityQueue;",
          "",
          "PriorityQueue pq;",
          "",
          "/* ===== 优先队列操作 ===== */",
          "",
          "void pq_init(PriorityQueue *p) { p->size = 0; }",
          "",
          "void pq_swim(PriorityQueue *p, int k) {",
          "    while (k > 0) {",
          "        int parent = (k - 1) / 2;",
          "        if (p->data[parent]->lb > p->data[k]->lb) {",
          "            Node *tmp = p->data[parent];",
          "            p->data[parent] = p->data[k];",
          "            p->data[k] = tmp;",
          "            k = parent;",
          "        } else break;",
          "    }",
          "}",
          "",
          "void pq_sink(PriorityQueue *p, int k) {",
          "    while (2 * k + 1 < p->size) {",
          "        int child = 2 * k + 1;",
          "        if (child + 1 < p->size && ",
          "            p->data[child + 1]->lb < p->data[child]->lb)",
          "            child++;",
          "        if (p->data[k]->lb > p->data[child]->lb) {",
          "            Node *tmp = p->data[k];",
          "            p->data[k] = p->data[child];",
          "            p->data[child] = tmp;",
          "            k = child;",
          "        } else break;",
          "    }",
          "}",
          "",
          "void pq_push(PriorityQueue *p, Node *node) {",
          "    if (p->size >= 100000) {",
          "        printf(\"TSP优先队列溢出！\\n\");",
          "        free(node);",
          "        return;",
          "    }",
          "    p->data[p->size] = node;",
          "    pq_swim(p, p->size);",
          "    p->size++;",
          "}",
          "",
          "Node *pq_pop(PriorityQueue *p) {",
          "    Node *top = p->data[0];",
          "    p->size--;",
          "    p->data[0] = p->data[p->size];",
          "    pq_sink(p, 0);",
          "    return top;",
          "}",
          "",
          "int pq_empty(PriorityQueue *p) { return p->size == 0; }",
          "",
          "int path_less(int a[], int b[], int len) {",
          "    for (int i = 0; i < len; i++) {",
          "        if (a[i] != b[i]) return a[i] < b[i];",
          "    }",
          "    return 0;",
          "}",
          "",
          "/* 返回城市 city 连接到其他城市的 k 条最短边之和。",
          " * 为了让下界足够乐观，这里不强行排除已经访问过的城市；",
          " * 这样算出的值可能偏小，但不会偏大，适合做安全下界。",
          " */",
          "double sum_k_min_edges(int city, int k) {",
          "    double first = INF, second = INF;",
          "",
          "    for (int j = 0; j < n; j++) {",
          "        if (j == city) continue;",
          "",
          "        if (dist[city][j] < first) {",
          "            second = first;",
          "            first = dist[city][j];",
          "        } else if (dist[city][j] < second) {",
          "            second = dist[city][j];",
          "        }",
          "    }",
          "",
          "    if (k == 1) return first;",
          "    if (k == 2) return first + second;",
          "",
          "    return INF;",
          "}",
          "",
          "/* ===== 下界计算 ===== */",
          "double calc_lb(Node *node) {",
          "    /* 如果已经访问完所有城市，下界就是当前路径 + 回到起点的真实代价 */",
          "    if (node->level == n) {",
          "        int last = node->path[n - 1];",
          "        return node->cost + dist[last][0];",
          "    }",
          "",
          "    double extra = 0.0;",
          "",
          "    if (node->level == 1) {",
          "        /* 根节点：起点还需要两条边接入最终回路 */",
          "        extra += sum_k_min_edges(0, 2);",
          "    } else {",
          "        /* 已经走出起点：起点还需要最后一条边回收成环 */",
          "        extra += sum_k_min_edges(0, 1);",
          "",
          "        /* 当前路径末尾还需要继续连向后面的城市 */",
          "        int last = node->path[node->level - 1];",
          "        extra += sum_k_min_edges(last, 1);",
          "    }",
          "",
          "    /* 每个未访问城市未来都需要两条边接入回路 */",
          "    for (int i = 0; i < n; i++) {",
          "        if (!node->visited[i]) {",
          "            extra += sum_k_min_edges(i, 2);",
          "        }",
          "    }",
          "",
          "    /* 从城市视角统计边会重复计数，因此除以 2 */",
          "    return node->cost + extra / 2.0;",
          "}",

          "/* ===== 分支限界求解 TSP =====",

          " * best_path 中只保存 A 到其他城市的访问顺序，最后回到 A 可在输出时补上。",
          " */",
          "double tsp_bb(int best_path[]) {",
          "    pq_init(&pq);",
          "",
          "    double best_cost = INF;   /* 当前找到的最短回路长度 */",
          "",
          "    /* 1. 初始化根节点：从城市 0，也就是 A 出发 */",
          "    Node *root = (Node *)calloc(1, sizeof(Node));",
          "    if (root == NULL) {",
          "        return INF;",
          "    }",
          "",
          "    root->level = 1;",
          "    root->path[0] = 0;",
          "    root->visited[0] = 1;",
          "    root->cost = 0.0;",
          "    root->lb = calc_lb(root);",
          "    pq_push(&pq, root);",
          "",
          "    /* 2. 只要队列不空，就不断探索 */",
          "    while (!pq_empty(&pq)) {",
          "        Node *cur = pq_pop(&pq); /* 取出 lb 最小的节点 */",
          "",
          "        /* 核心剪枝：理论下界都不优于当前最优解，直接放弃 */",
          "        if (cur->lb >= best_cost) {",
          "            free(cur);",
          "            continue;",
          "        }",
          "",
          "        /* 所有城市都已经访问完：检查回到起点后的完整回路长度 */",
          "        if (cur->level == n) {",
          "            int last = cur->path[n - 1];",
          "            double total = cur->cost + dist[last][0];",
          "",
          "            if (total < best_cost ||",
          "                (total == best_cost && path_less(cur->path, best_path, n))) {",
          "                best_cost = total;",
          "                memcpy(best_path, cur->path, n * sizeof(int));",
          "            }",
          "",
          "            free(cur);",
          "            continue;",
          "        }",
          "",
          "        /* 扩展：尝试走向每一个尚未访问的城市 */",
          "        int last = cur->path[cur->level - 1];",
          "",
          "        for (int next = 0; next < n; next++) {",
          "            if (cur->visited[next]) continue;",
          "            if (dist[last][next] >= INF) continue; /* 非完全图时可用 */",
          "",
          "            Node *child = (Node *)malloc(sizeof(Node));",
          "            if (child == NULL) {",
          "                /* 教学代码中直接跳过；工业代码应释放队列中剩余节点 */",
          "                continue;",
          "            }",
          "",
          "            memcpy(child, cur, sizeof(Node));",
          "",
          "            child->path[cur->level] = next;",
          "            child->visited[next] = 1;",
          "            child->level = cur->level + 1;",
          "            child->cost = cur->cost + dist[last][next];",
          "            child->lb = calc_lb(child);",
          "",
          "            /* 只有下界仍然有希望优于当前最优解，才入队 */",
          "            if (child->lb < best_cost) {",
          "                pq_push(&pq, child);",
          "            } else {",
          "                free(child);",
          "            }",
          "        }",
          "",
          "        free(cur);",
          "    }",
          "",
          "    /* 清空优先队列中残留的节点（防内存泄漏） */",
          "    while (!pq_empty(&pq)) {",
          "        free(pq_pop(&pq));",
          "    }",
          "",
          "    return best_cost;",
          "}",
          "",
          "/* ===== 主函数 ===== */",
          "int main(void) {",
          "    n = 5;",
          "    ",
          "    double example[5][5] = {",
          "        {0, 3, 6, 2, 7},",
          "        {3, 0, 4, 9, 3},",
          "        {6, 4, 0, 5, 8},",
          "        {2, 9, 5, 0, 6},",
          "        {7, 3, 8, 6, 0}",
          "    };",
          "    ",
          "    for (int i = 0; i < n; i++)",
          "        for (int j = 0; j < n; j++)",
          "            dist[i][j] = example[i][j];",
          "    ",
          "    int best_path[MAX_N] = {0};",
          "    double best_cost = tsp_bb(best_path);",
          "    ",
          "    printf(\"TSP最优路径：\");",
          "    for (int i = 0; i < n; i++) {",
          "        printf(\"%c -> \", 'A' + best_path[i]);",
          "    }",
          "    printf(\"%c\\n\", 'A' + best_path[0]);",
          "    printf(\"最短距离：%.0f\\n\", best_cost);",
          "    ",
          "    return 0;",
          "}",
          ""
        ],

const firstKey = Object.keys(ALGOS)[0];
const requestedKey = new URLSearchParams(location.search).get('algo');
const savedAtOpen = DHLearning.load();
let currentKey = ALGOS[requestedKey]
  ? requestedKey
  : (savedAtOpen.last && savedAtOpen.last.chapter === CHAPTER_NUM && ALGOS[savedAtOpen.last.algorithm]
      ? savedAtOpen.last.algorithm
      : firstKey);
let currentMode = null;
const engine = new TraceEngine('viz-canvas', 'code-body', 'var-grid', 'callstack');
const tabsEl = document.getElementById('algo-tabs');
const modeTabsEl = document.getElementById('mode-tabs');

function has_modes(algo) {
  return algo && algo.modes && typeof algo.modes === 'object';
}

function mode_label(rawAlgo, mode) {
  const labels = rawAlgo.modeLabels || {};
  if (labels[mode]) return labels[mode];
  if (mode === 'concept') return '理解动画';
  if (mode === 'trace') return '代码执行';
  return mode;
}

function resolve_algo(rawAlgo) {
  if (!has_modes(rawAlgo)) return rawAlgo;
  const mode = currentMode || rawAlgo.defaultMode || Object.keys(rawAlgo.modes)[0];
  return rawAlgo.modes[mode] || rawAlgo.modes[rawAlgo.defaultMode] || Object.values(rawAlgo.modes)[0];
}

function is_concept_algo(algo) {
  if (!algo) return false;
  const classes = algo.var_classes || {};
  if (Object.values(classes).some(info => info && info.type === 'concept')) return true;
  return (algo.steps || []).some(step => step.vars && step.vars.concept);
}

function update_tab_states() {
  const completed = new Set(DHLearning.load().completedDemos);
  tabsEl.querySelectorAll('.algo-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.key === currentKey);
    btn.classList.toggle('completed', completed.has(DHLearning.demoId(CHAPTER_NUM, btn.dataset.key)));
    btn.setAttribute('aria-selected', String(btn.dataset.key === currentKey));
  });
}

function update_chapter_progress() {
  const state = DHLearning.load();
  const completed = new Set(state.completedDemos);
  const keys = Object.keys(ALGOS);
  const done = keys.filter(key => completed.has(DHLearning.demoId(CHAPTER_NUM, key))).length;
  document.getElementById('chapter-progress-text').textContent = `${done} / ${keys.length} 个演示完成`;
  document.getElementById('chapter-progress-fill').style.width = `${keys.length ? done / keys.length * 100 : 0}%`;
  update_tab_states();
}

function render_mode_tabs(rawAlgo) {
  modeTabsEl.innerHTML = '';
  if (!has_modes(rawAlgo)) {
    modeTabsEl.classList.remove('visible');
    currentMode = null;
    return;
  }
  modeTabsEl.classList.add('visible');
  const label = document.createElement('span');
  label.className = 'mode-label';
  label.textContent = '学习方式';
  modeTabsEl.appendChild(label);
  const activeMode = currentMode || rawAlgo.defaultMode || Object.keys(rawAlgo.modes)[0];
  Object.keys(rawAlgo.modes).forEach(mode => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'mode-tab' + (mode === activeMode ? ' active' : '');
    btn.textContent = mode_label(rawAlgo, mode);
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', String(mode === activeMode));
    btn.addEventListener('click', () => {
      if (currentMode === mode) return;
      currentMode = mode;
      load_current_algo(false);
      if (matchMedia('(max-width: 900px)').matches) {
        set_mobile_view(mode === 'trace' ? 'code' : 'animation');
      }
    });
    modeTabsEl.appendChild(btn);
  });
}

function load_current_algo(allowRestore = true) {
  const rawAlgo = ALGOS[currentKey];
  const beforeLoad = DHLearning.load().last;
  if (has_modes(rawAlgo)) {
    const savedMode = beforeLoad && beforeLoad.chapter === CHAPTER_NUM && beforeLoad.algorithm === currentKey
      ? beforeLoad.mode
      : null;
    if (!currentMode) currentMode = savedMode && rawAlgo.modes[savedMode]
      ? savedMode
      : (rawAlgo.defaultMode || Object.keys(rawAlgo.modes)[0]);
  } else {
    currentMode = null;
  }
  render_mode_tabs(rawAlgo);
  const activeAlgo = resolve_algo(rawAlgo);
  document.body.classList.toggle('concept-mode', currentMode === 'concept' || is_concept_algo(activeAlgo));
  engine.stop_play();
  engine.load(activeAlgo);
  try {
    const currentUrl = new URL(location.href);
    currentUrl.searchParams.set('algo', currentKey);
    history.replaceState(null, '', currentUrl.href);
  } catch (_) {
    // file:// 预览环境可能限制 history API，不影响演示本身。
  }
  update_tab_states();

  if (
    allowRestore
    && beforeLoad
    && beforeLoad.chapter === CHAPTER_NUM
    && beforeLoad.algorithm === currentKey
    && beforeLoad.mode === currentMode
    && beforeLoad.step > 0
    && activeAlgo.steps.length
  ) {
    const restoreStep = Math.min(beforeLoad.step, activeAlgo.steps.length - 1);
    requestAnimationFrame(() => engine.go_to_step(restoreStep));
  }
}

Object.entries(ALGOS).forEach(([key, algo]) => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'algo-tab';
  btn.dataset.key = key;
  btn.textContent = algo.title;
  btn.setAttribute('role', 'tab');
  btn.setAttribute('aria-selected', String(key === currentKey));
  btn.addEventListener('click', () => {
    if (currentKey === key) return;
    currentKey = key;
    currentMode = has_modes(algo) ? (algo.defaultMode || Object.keys(algo.modes)[0]) : null;
    load_current_algo(true);
  });
  tabsEl.appendChild(btn);
});

document.addEventListener('dh:stepchange', event => {
  const detail = event.detail || {};
  DHLearning.updateLast(CHAPTER_NUM, currentKey, currentMode, detail.currentStep);
  if (detail.atEnd) DHLearning.markDemoComplete(CHAPTER_NUM, currentKey);
  update_chapter_progress();
});

document.getElementById('btn-play').addEventListener('click', () => engine.playing ? engine.stop_play() : engine.start_play());
document.getElementById('btn-step').addEventListener('click', () => { engine.stop_play(); engine.step_forward(); });
document.getElementById('btn-reset').addEventListener('click', () => engine.reset());
document.getElementById('btn-back').addEventListener('click', () => { engine.stop_play(); engine.step_backward(); });
document.getElementById('btn-to-bp').addEventListener('click', () => { engine.stop_play(); engine.play_to_bp(); });

const speedSlider = document.getElementById('speed-slider');
const savedSpeed = localStorage.getItem('dh_speed');
if (savedSpeed !== null) speedSlider.value = savedSpeed;
speedSlider.setAttribute('aria-valuetext', `速度 ${speedSlider.value}`);
speedSlider.addEventListener('input', () => {
  localStorage.setItem('dh_speed', speedSlider.value);
  speedSlider.setAttribute('aria-valuetext', `速度 ${speedSlider.value}`);
  if (engine.playing) { clearTimeout(engine.playTimer); engine._play_loop(); }
});
speedSlider.addEventListener('keydown', event => {
  if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
  event.preventDefault();
  event.stopPropagation();
  const direction = event.key === 'ArrowRight' ? 1 : -1;
  speedSlider.value = String(Math.max(Number(speedSlider.min), Math.min(Number(speedSlider.max), Number(speedSlider.value) + direction)));
  speedSlider.dispatchEvent(new Event('input', { bubbles: true }));
});
document.getElementById('font-dec').addEventListener('click', () => engine.font_dec());
document.getElementById('font-inc').addEventListener('click', () => engine.font_inc());

document.addEventListener('keydown', event => {
  const target = event.target;
  if (target && target.closest && target.closest('button,input,select,textarea,a,summary,[contenteditable="true"]')) return;
  if (event.key === ' ') {
    event.preventDefault();
    engine.playing ? engine.stop_play() : engine.start_play();
  } else if (event.key === 'ArrowRight') {
    event.preventDefault();
    engine.stop_play();
    engine.step_forward();
  } else if (event.key === 'ArrowLeft') {
    event.preventDefault();
    engine.stop_play();
    engine.step_backward();
  } else if (event.key.toLowerCase() === 'r' && !event.metaKey && !event.ctrlKey && !event.altKey) {
    engine.reset();
  }
});

function set_mobile_view(view) {
  document.body.dataset.mobileView = view;
  document.querySelectorAll('.mobile-view-switcher button').forEach(btn => {
    const active = btn.dataset.mobileView === view;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-selected', String(active));
  });
  if (view === 'animation' && engine.currentStep >= 0) {
    requestAnimationFrame(() => engine.go_to_step(engine.currentStep));
  }
}

document.querySelectorAll('.mobile-view-switcher button').forEach(btn => {
  btn.addEventListener('click', () => set_mobile_view(btn.dataset.mobileView));
});

DHLearning.visitChapter(CHAPTER_NUM);
update_chapter_progress();
load_current_algo(true);
</script>
