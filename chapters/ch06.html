          "#include <stdio.h>",
          "#include <string.h>",
          "typedef struct {",
          "    char name[20];",
          "    int score;",
          "} Student;",
          "/* 冒泡排序：稳定的 */",
          "void bubble_sort(Student arr[], int n) {",
          "    for (int i = 0; i < n - 1; i++) {",
          "        for (int j = 0; j < n - 1 - i; j++) {",
          "            if (arr[j].score > arr[j + 1].score) {",
          "                Student temp = arr[j];",
          "                arr[j] = arr[j + 1];",
          "                arr[j + 1] = temp;",
          "            }",
          "        }",
          "    }",
          "}",
          "/* 选择排序：不稳定的 */",
          "void selection_sort(Student arr[], int n) {",
          "    for (int i = 0; i < n - 1; i++) {",
          "        int minIdx = i;",
          "        for (int j = i + 1; j < n; j++) {",
          "            if (arr[j].score < arr[minIdx].score) {",
          "                minIdx = j;",
          "            }",
          "        }",
          "        /* 注意！这个交换可能跳过同分元素，打乱相对顺序 */",
          "        if (minIdx != i) {",
          "            Student temp = arr[i];",
          "            arr[i] = arr[minIdx];",
          "            arr[minIdx] = temp;",
          "        }",
          "    }",
          "}",
          "int main(void) {",
          "    Student students[] = {",
          "        {\"张三\", 658}, {\"李四\", 658}, {\"王五\", 600}, {\"赵六\", 701}",
          "    };",
          "    int n = 4;",
          "    bubble_sort(students, n);",
          "    printf(\"冒泡排序（稳定）：\");",
          "    for (int i = 0; i < n; i++)",

          "    };",
          "    selection_sort(students2, n);",
          "    printf(\"选择排序（不稳定）：\");",
          "    for (int i = 0; i < n; i++)",
          "        printf(\"%s(%d) \", students2[i].name, students2[i].score);",

          "#include <stdlib.h>",
          "/* 归并排序：需要额外 O(n) 空间 */",
          "int merge(int arr[], int left, int mid, int right) {",
          "    int n1 = mid - left + 1;",
          "    int n2 = right - mid;",
          "    /* 看！这里申请了两个临时数组：这就是“搬家”的代价 */",
          "    int *L = (int *)malloc(n1 * sizeof(int));",
          "    int *R = (int *)malloc(n2 * sizeof(int));",
          "    if (!L || !R) {",
          "        free(L);",
          "        free(R);",
          "        return 0;",
          "    }",
          "    for (int i = 0; i < n1; i++) L[i] = arr[left + i];",
          "    for (int j = 0; j < n2; j++) R[j] = arr[mid + 1 + j];",
          "    int i = 0, j = 0, k = left;",
          "    while (i < n1 && j < n2) {",
          "        if (L[i] <= R[j]) arr[k++] = L[i++];",
          "        else arr[k++] = R[j++];",
          "    }",

          "    while (j < n2) arr[k++] = R[j++];",
          "    free(L);",
          "    free(R);",
          "    return 1;",
          "}",

          "    if (left < right) {",
          "        int mid = left + (right - left) / 2;",
          "        if (!merge_sort(arr, left, mid)) return 0;",
          "        if (!merge_sort(arr, mid + 1, right)) return 0;",
          "        if (!merge(arr, left, mid, right)) return 0;",
          "    }",
          "    return 1;",

        "title": "外部排序（多路归并）",
        "source": [
          "/* 外部排序 多路归并 */",
          "#include <stdio.h>",
          "#include <stdlib.h>",
          "#include <limits.h>",
          "#define MEMORY_SIZE 10  // 内存一次只能放10个元素",
          "// 比较函数",
          "int cmp(const void *a, const void *b) {",
          "    int x = *(const int *)a;",
          "    int y = *(const int *)b;",
          "    return (x > y) - (x < y);",
          "}",
          "/*",
          " * 步骤1：生成初始归并段",
          " * 每次从大文件读MEMORY_SIZE个数，排序后写入一个小文件",
          " */",
          "int create_runs(const char *inputFile, char runFiles[][50], int maxRuns) {",
          "    FILE *fin = fopen(inputFile, \"r\");",
          "    if (!fin) return -1;",
          "    int buffer[MEMORY_SIZE];",
          "    int runCount = 0;",
          "    while (!feof(fin) && runCount < maxRuns) {",
          "        int count = 0;",
          "        // 读一批数据到内存",
          "        while (count < MEMORY_SIZE && fscanf(fin, \"%d\", &buffer[count]) == 1) {",
          "            count++;",
          "        }",
          "        if (count == 0) break;",
          "        // 内部排序",
          "        qsort(buffer, count, sizeof(int), cmp);",
          "        // 写入临时文件",
          "        FILE *frun = fopen(runFiles[runCount], \"w\");",
          "        if (!frun) {",
          "            fclose(fin);",
          "            return -1;",
          "        }",
          "        for (int i = 0; i < count; i++) {",
          "            fprintf(frun, \"%d\\n\", buffer[i]);",
          "        }",
          "        fclose(frun);",
          "        runCount++;",
          "    }",
          "    fclose(fin);",
          "    return runCount;",
          "}",
          "/*",
          " * 步骤2：二路归并（简化版，实际可以用多路）",
          " */",
          "int two_way_merge(char file1[], char file2[], char output[]) {",
          "    FILE *f1 = fopen(file1, \"r\");",
          "    FILE *f2 = fopen(file2, \"r\");",
          "    FILE *fout = fopen(output, \"w\");",
          "    if (!f1 || !f2 || !fout) {",
          "        if (f1) fclose(f1);",
          "        if (f2) fclose(f2);",
          "        if (fout) fclose(fout);",
          "        return 0;",
          "    }",
          "    int a, b;",
          "    int hasA = (fscanf(f1, \"%d\", &a) == 1);",
          "    int hasB = (fscanf(f2, \"%d\", &b) == 1);",
          "    while (hasA && hasB) {",
          "        if (a <= b) {",
          "            fprintf(fout, \"%d\\n\", a);",
          "            hasA = (fscanf(f1, \"%d\", &a) == 1);",
          "        } else {",
          "            fprintf(fout, \"%d\\n\", b);",
          "            hasB = (fscanf(f2, \"%d\", &b) == 1);",
          "        }",
          "    }",
          "    while (hasA) {",
          "        fprintf(fout, \"%d\\n\", a);",
          "        hasA = (fscanf(f1, \"%d\", &a) == 1);",
          "    }",
          "    while (hasB) {",
          "        fprintf(fout, \"%d\\n\", b);",
          "        hasB = (fscanf(f2, \"%d\", &b) == 1);",
          "    }",
          "    fclose(f1); fclose(f2); fclose(fout);",
          "    return 1;",
          "}",
          "// 测试：外部排序——模拟\"数据太大，内存放不下\"的场景",
          "int main(void) {",
          "    // 1. 生成一个模拟的大文件（20个整数）",
          "    const char *inputFile = \"/tmp/ext_sort_input.txt\";",
          "    FILE *f = fopen(inputFile, \"w\");",
          "    if (!f) {",
          "        printf(\"创建输入文件失败\\n\");",
          "        return 1;",
          "    }",
          "    int testData[] = {42, 15, 73, 28, 61, 9, 34, 88, 17, 55,",
          "                      3, 67, 21, 49, 82, 11, 36, 94, 25, 70};",
          "    for (int i = 0; i < 20; i++) {",
          "        fprintf(f, \"%d\\n\", testData[i]);",
          "    }",
          "    fclose(f);",

          "        }",

          "        fclose(fout);",

        "title": "希尔排序",
        "source": [
          "#include <stdio.h>",
          "void shell_sort(int arr[], int n) {",
          "    // gap 从 n/2 开始，每轮折半，直到 1",
          "    for (int gap = n / 2; gap > 0; gap /= 2) {",
          "        // 对每个 gap，做一轮\"间隔为 gap\"的插入排序",
          "        for (int i = gap; i < n; i++) {",
          "            int temp = arr[i];",
          "            int j = i;",
          "            while (j >= gap && arr[j - gap] > temp) {",
          "                arr[j] = arr[j - gap];",
          "                j -= gap;",
          "            }",
          "            arr[j] = temp;",
          "        }",
          "    }",
          "}",
          "// 测试：希尔排序",
          "int main(void) {",
          "    int arr[] = {50, 10, 90, 30, 70, 40, 80, 60, 20};",
          "    int n = sizeof(arr) / sizeof(arr[0]);",
          "    printf(\"排序前：\");",
          "    for (int i = 0; i < n; i++) printf(\"%d \", arr[i]);",
          "    printf(\"\\n\");",
          "    shell_sort(arr, n);",
          "    printf(\"排序后：\");",
          "    for (int i = 0; i < n; i++) printf(\"%d \", arr[i]);",
          "    printf(\"\\n\");",
          "    return 0;",
          "}"

        "source": [
          "#include <stdio.h>",
          "void heapify(int arr[], int n, int i) {",
          "    int largest = i;",
          "    int left = 2 * i + 1;",
          "    int right = 2 * i + 2;",
          "    if (left < n && arr[left] > arr[largest])",
          "        largest = left;",
          "    if (right < n && arr[right] > arr[largest])",
          "        largest = right;",
          "    if (largest != i) {",
          "        int temp = arr[i];",
          "        arr[i] = arr[largest];",
          "        arr[largest] = temp;",
          "        heapify(arr, n, largest);",
          "    }",
          "}",
          "void heap_sort(int arr[], int n) {",
          "    // 建堆：从最后一个非叶节点开始",
          "    for (int i = n / 2 - 1; i >= 0; i--)",
          "        heapify(arr, n, i);",
          "    // 一个个取出堆顶",
          "    for (int i = n - 1; i > 0; i--) {",
          "        int temp = arr[0];",
          "        arr[0] = arr[i];",
          "        arr[i] = temp;",
          "        heapify(arr, i, 0);",
          "    }",
          "}",
          "/* ===== 自动生成的测试入口 ===== */",
          "#define N 9",
          "int main(void) {",
          "    int d[N] = {50, 10, 90, 30, 70, 40, 80, 60, 20};",
          "    int i;",
          "    printf(\"=== heapify ===\\n\");",
          "    {",
          "        int arr[N];",
          "        for (i = 0; i < N; i++) arr[i] = d[i];",
          "        printf(\"调整前: \");",
          "        for (i = 0; i < N; i++) printf(\"%d \", arr[i]);",
          "        printf(\"\\n\");",
          "        heapify(arr, N, 0);",
          "        printf(\"调整后（仅修复根节点的堆性质）: \");",
          "        for (i = 0; i < N; i++) printf(\"%d \", arr[i]);",
          "        printf(\"\\n\");",
          "    }",
          "    printf(\"=== heap_sort ===\\n\");",
          "    {",
          "        int arr[N];",
          "        for (i = 0; i < N; i++) arr[i] = d[i];",
          "        printf(\"排序前: \");",
          "        for (i = 0; i < N; i++) printf(\"%d \", arr[i]);",
          "        printf(\"\\n\");",
          "        heap_sort(arr, N);",
          "        printf(\"排序后: \");",
          "        for (i = 0; i < N; i++) printf(\"%d \", arr[i]);",
          "        printf(\"\\n\");",
          "    }",

          "#include <stdio.h>",
          "#define INSERTION_THRESHOLD 8",
          "static void swap(int *a, int *b) {",
          "    int temp = *a;",
          "    *a = *b;",
          "    *b = temp;",
          "}",
          "static void print_array(const int arr[], int n) {",
          "    for (int i = 0; i < n; i++) {",
          "        printf(\"%d \", arr[i]);",
          "    }",
          "    printf(\"\\n\");",
          "}",
          "/* 小数组用插入排序，常数开销更小 */",
          "static void insertion_sort_range(int arr[], int low, int high) {",
          "    for (int i = low + 1; i <= high; i++) {",
          "        int key = arr[i];",
          "        int j = i - 1;",
          "        while (j >= low && arr[j] > key) {",
          "            arr[j + 1] = arr[j];",
          "            j--;",
          "        }",
          "        arr[j + 1] = key;",
          "    }",
          "}",
          "static int median_of_three(int arr[], int low, int high) {",
          "    int mid = low + (high - low) / 2;",
          "    if (arr[mid] < arr[low]) swap(&arr[mid], &arr[low]);",
          "    if (arr[high] < arr[low]) swap(&arr[high], &arr[low]);",
          "    if (arr[high] < arr[mid]) swap(&arr[high], &arr[mid]);",
          "    return mid;  /* 此时 arr[mid] 是三者中的中间值 */",
          "}",
          "static int partition(int arr[], int low, int high) {",
          "    int pivotIndex = median_of_three(arr, low, high);",
          "    swap(&arr[pivotIndex], &arr[high]);",
          "    int pivot = arr[high];",
          "    int i = low - 1;",
          "    for (int j = low; j < high; j++) {",
          "        if (arr[j] < pivot) {",
          "            i++;",
          "            swap(&arr[i], &arr[j]);",
          "        }",
          "    }",
          "    swap(&arr[i + 1], &arr[high]);",
          "    return i + 1;",
          "}",
          "static void heapify_range(int arr[], int low, int heapSize, int root) {",
          "    int largest = root;",
          "    int left = 2 * root + 1;",
          "    int right = 2 * root + 2;",
          "    if (left < heapSize && arr[low + left] > arr[low + largest]) {",
          "        largest = left;",
          "    }",
          "    if (right < heapSize && arr[low + right] > arr[low + largest]) {",
          "        largest = right;",
          "    }",
          "    if (largest != root) {",
          "        swap(&arr[low + root], &arr[low + largest]);",
          "        heapify_range(arr, low, heapSize, largest);",
          "    }",
          "}",
          "/* 递归太深时切换堆排序，避免快排退化到 O(n^2) */",
          "static void heap_sort_range(int arr[], int low, int high) {",
          "    int heapSize = high - low + 1;",
          "    for (int i = heapSize / 2 - 1; i >= 0; i--) {",
          "        heapify_range(arr, low, heapSize, i);",
          "    }",
          "    for (int end = heapSize - 1; end > 0; end--) {",
          "        swap(&arr[low], &arr[low + end]);",
          "        heapify_range(arr, low, end, 0);",
          "    }",
          "}",
          "static int floor_log2(int n) {",
          "    int result = 0;",
          "    while (n > 1) {",
          "        n >>= 1;",
          "        result++;",
          "    }",
          "    return result;",
          "}",
          "static void quick_sort_engine(int arr[], int low, int high, int depthLimit) {",
          "    while (high - low + 1 > INSERTION_THRESHOLD) {",
          "        if (depthLimit == 0) {",
          "            heap_sort_range(arr, low, high);  /* 兜底：避免快排退化 */",
          "            return;",
          "        }",
          "        depthLimit--;",
          "        int pivotPos = partition(arr, low, high);",
          "        int leftSize = pivotPos - low;",
          "        int rightSize = high - pivotPos;",
          "        /* 只递归较小的一边，较大的一边继续 while 循环 */",
          "        if (leftSize < rightSize) {",
          "            quick_sort_engine(arr, low, pivotPos - 1, depthLimit);",
          "            low = pivotPos + 1;",
          "        } else {",
          "            quick_sort_engine(arr, pivotPos + 1, high, depthLimit);",
          "            high = pivotPos - 1;",
          "        }",
          "    }",
          "    insertion_sort_range(arr, low, high);  /* 小数组收尾 */",
          "}",
          "void quick_sort_optimized(int arr[], int n) {",
          "    if (n <= 1) return;",
          "    int depthLimit = 2 * floor_log2(n);",
          "    quick_sort_engine(arr, 0, n - 1, depthLimit);",
          "}",
          "static void run_case(const char *name, int arr[], int n) {",
          "    printf(\"=== %s ===\\n\", name);",
          "    printf(\"排序前: \");",
          "    print_array(arr, n);",
          "    quick_sort_optimized(arr, n);",
          "    printf(\"排序后: \");",
          "    print_array(arr, n);",
          "    printf(\"\\n\");",
          "}",
          "int main(void) {",
          "    int normal[] = {50, 10, 90, 30, 70, 40, 80, 60, 20};",
          "    int sorted[] = {10, 20, 30, 40, 50, 60, 70, 80, 90};",
          "    int reversed[] = {90, 80, 70, 60, 50, 40, 30, 20, 10};",
          "    int repeated[] = {30, 10, 30, 20, 10, 40, 30, 20, 50};",
          "    run_case(\"普通无序数组\", normal, 9);",
          "    run_case(\"已经有序数组\", sorted, 9);",
          "    run_case(\"完全逆序数组\", reversed, 9);",
          "    run_case(\"包含重复元素\", repeated, 9);",
          "    return 0;",
          "}"

          "#include <stdio.h>",
          "/* 打印数组，方便观察每个样例的排序结果 */",
          "void print_array(const int arr[], int n) {",
          "    for (int i = 0; i < n; i++) {",
          "        printf(\"%d \", arr[i]);",
          "    }",
          "    printf(\"\\n\");",
          "}",
          "/* 插入排序：左侧保持有序，每次把新元素插入正确位置 */",
          "void insertion_sort(int arr[], int n) {",
          "    for (int i = 1; i < n; i++) {",
          "        int key = arr[i];",
          "        int j = i - 1;",
          "        while (j >= 0 && arr[j] > key) {",
          "            arr[j + 1] = arr[j];",
          "            j--;",
          "        }",
          "        arr[j + 1] = key;",
          "    }",
          "}",
          "/* 运行一个样例，避免 main 里重复写打印逻辑 */",
          "void run_case(const char *name, int arr[], int n) {",
          "    printf(\"=== %s ===\\n\", name);",
          "    printf(\"排序前: \");",
          "    print_array(arr, n);",
          "    insertion_sort(arr, n);",
          "    printf(\"排序后: \");",
          "    print_array(arr, n);",
          "    printf(\"\\n\");",
          "}",

const firstKey = Object.keys(ALGOS)[0];
const requestedKey = new URLSearchParams(location.search).get('algo');
const savedAtOpen = DHLearning.load();
let currentKey = ALGOS[requestedKey]
  ? requestedKey
  : (savedAtOpen.last && savedAtOpen.last.chapter === CHAPTER_NUM && ALGOS[savedAtOpen.last.algorithm]
      ? savedAtOpen.last.algorithm
      : firstKey);
let currentMode = null;
const engine = new TraceEngine('viz-canvas', 'code-body', 'var-grid', 'callstack');
const tabsEl = document.getElementById('algo-tabs');
const modeTabsEl = document.getElementById('mode-tabs');

function has_modes(algo) {
  return algo && algo.modes && typeof algo.modes === 'object';
}

function mode_label(rawAlgo, mode) {
  const labels = rawAlgo.modeLabels || {};
  if (labels[mode]) return labels[mode];
  if (mode === 'concept') return '理解动画';
  if (mode === 'trace') return '代码执行';
  return mode;
}

function resolve_algo(rawAlgo) {
  if (!has_modes(rawAlgo)) return rawAlgo;
  const mode = currentMode || rawAlgo.defaultMode || Object.keys(rawAlgo.modes)[0];
  return rawAlgo.modes[mode] || rawAlgo.modes[rawAlgo.defaultMode] || Object.values(rawAlgo.modes)[0];
}

function is_concept_algo(algo) {
  if (!algo) return false;
  const classes = algo.var_classes || {};
  if (Object.values(classes).some(info => info && info.type === 'concept')) return true;
  return (algo.steps || []).some(step => step.vars && step.vars.concept);
}

function update_tab_states() {
  const completed = new Set(DHLearning.load().completedDemos);
  tabsEl.querySelectorAll('.algo-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.key === currentKey);
    btn.classList.toggle('completed', completed.has(DHLearning.demoId(CHAPTER_NUM, btn.dataset.key)));
    btn.setAttribute('aria-selected', String(btn.dataset.key === currentKey));
  });
}

function update_chapter_progress() {
  const state = DHLearning.load();
  const completed = new Set(state.completedDemos);
  const keys = Object.keys(ALGOS);
  const done = keys.filter(key => completed.has(DHLearning.demoId(CHAPTER_NUM, key))).length;
  document.getElementById('chapter-progress-text').textContent = `${done} / ${keys.length} 个演示完成`;
  document.getElementById('chapter-progress-fill').style.width = `${keys.length ? done / keys.length * 100 : 0}%`;
  update_tab_states();
}

function render_mode_tabs(rawAlgo) {
  modeTabsEl.innerHTML = '';
  if (!has_modes(rawAlgo)) {
    modeTabsEl.classList.remove('visible');
    currentMode = null;
    return;
  }
  modeTabsEl.classList.add('visible');
  const label = document.createElement('span');
  label.className = 'mode-label';
  label.textContent = '学习方式';
  modeTabsEl.appendChild(label);
  const activeMode = currentMode || rawAlgo.defaultMode || Object.keys(rawAlgo.modes)[0];
  Object.keys(rawAlgo.modes).forEach(mode => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'mode-tab' + (mode === activeMode ? ' active' : '');
    btn.textContent = mode_label(rawAlgo, mode);
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', String(mode === activeMode));
    btn.addEventListener('click', () => {
      if (currentMode === mode) return;
      currentMode = mode;
      load_current_algo(false);
      if (matchMedia('(max-width: 900px)').matches) {
        set_mobile_view(mode === 'trace' ? 'code' : 'animation');
      }
    });
    modeTabsEl.appendChild(btn);
  });
}

function load_current_algo(allowRestore = true) {
  const rawAlgo = ALGOS[currentKey];
  const beforeLoad = DHLearning.load().last;
  if (has_modes(rawAlgo)) {
    const savedMode = beforeLoad && beforeLoad.chapter === CHAPTER_NUM && beforeLoad.algorithm === currentKey
      ? beforeLoad.mode
      : null;
    if (!currentMode) currentMode = savedMode && rawAlgo.modes[savedMode]
      ? savedMode
      : (rawAlgo.defaultMode || Object.keys(rawAlgo.modes)[0]);
  } else {
    currentMode = null;
  }
  render_mode_tabs(rawAlgo);
  const activeAlgo = resolve_algo(rawAlgo);
  document.body.classList.toggle('concept-mode', currentMode === 'concept' || is_concept_algo(activeAlgo));
  engine.stop_play();
  engine.load(activeAlgo);
  try {
    const currentUrl = new URL(location.href);
    currentUrl.searchParams.set('algo', currentKey);
    history.replaceState(null, '', currentUrl.href);
  } catch (_) {
    // file:// 预览环境可能限制 history API，不影响演示本身。
  }
  update_tab_states();

  if (
    allowRestore
    && beforeLoad
    && beforeLoad.chapter === CHAPTER_NUM
    && beforeLoad.algorithm === currentKey
    && beforeLoad.mode === currentMode
    && beforeLoad.step > 0
    && activeAlgo.steps.length
  ) {
    const restoreStep = Math.min(beforeLoad.step, activeAlgo.steps.length - 1);
    requestAnimationFrame(() => engine.go_to_step(restoreStep));
  }
}

Object.entries(ALGOS).forEach(([key, algo]) => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'algo-tab';
  btn.dataset.key = key;
  btn.textContent = algo.title;
  btn.setAttribute('role', 'tab');
  btn.setAttribute('aria-selected', String(key === currentKey));
  btn.addEventListener('click', () => {
    if (currentKey === key) return;
    currentKey = key;
    currentMode = has_modes(algo) ? (algo.defaultMode || Object.keys(algo.modes)[0]) : null;
    load_current_algo(true);
  });
  tabsEl.appendChild(btn);
});

document.addEventListener('dh:stepchange', event => {
  const detail = event.detail || {};
  DHLearning.updateLast(CHAPTER_NUM, currentKey, currentMode, detail.currentStep);
  if (detail.atEnd) DHLearning.markDemoComplete(CHAPTER_NUM, currentKey);
  update_chapter_progress();
});

document.getElementById('btn-play').addEventListener('click', () => engine.playing ? engine.stop_play() : engine.start_play());
document.getElementById('btn-step').addEventListener('click', () => { engine.stop_play(); engine.step_forward(); });
document.getElementById('btn-reset').addEventListener('click', () => engine.reset());
document.getElementById('btn-back').addEventListener('click', () => { engine.stop_play(); engine.step_backward(); });
document.getElementById('btn-to-bp').addEventListener('click', () => { engine.stop_play(); engine.play_to_bp(); });

const speedSlider = document.getElementById('speed-slider');
const savedSpeed = localStorage.getItem('dh_speed');
if (savedSpeed !== null) speedSlider.value = savedSpeed;
speedSlider.setAttribute('aria-valuetext', `速度 ${speedSlider.value}`);
speedSlider.addEventListener('input', () => {
  localStorage.setItem('dh_speed', speedSlider.value);
  speedSlider.setAttribute('aria-valuetext', `速度 ${speedSlider.value}`);
  if (engine.playing) { clearTimeout(engine.playTimer); engine._play_loop(); }
});
speedSlider.addEventListener('keydown', event => {
  if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
  event.preventDefault();
  event.stopPropagation();
  const direction = event.key === 'ArrowRight' ? 1 : -1;
  speedSlider.value = String(Math.max(Number(speedSlider.min), Math.min(Number(speedSlider.max), Number(speedSlider.value) + direction)));
  speedSlider.dispatchEvent(new Event('input', { bubbles: true }));
});
document.getElementById('font-dec').addEventListener('click', () => engine.font_dec());
document.getElementById('font-inc').addEventListener('click', () => engine.font_inc());

document.addEventListener('keydown', event => {
  const target = event.target;
  if (target && target.closest && target.closest('button,input,select,textarea,a,summary,[contenteditable="true"]')) return;
  if (event.key === ' ') {
    event.preventDefault();
    engine.playing ? engine.stop_play() : engine.start_play();
  } else if (event.key === 'ArrowRight') {
    event.preventDefault();
    engine.stop_play();
    engine.step_forward();
  } else if (event.key === 'ArrowLeft') {
    event.preventDefault();
    engine.stop_play();
    engine.step_backward();
  } else if (event.key.toLowerCase() === 'r' && !event.metaKey && !event.ctrlKey && !event.altKey) {
    engine.reset();
  }
});

function set_mobile_view(view) {
  document.body.dataset.mobileView = view;
  document.querySelectorAll('.mobile-view-switcher button').forEach(btn => {
    const active = btn.dataset.mobileView === view;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-selected', String(active));
  });
  if (view === 'animation' && engine.currentStep >= 0) {
    requestAnimationFrame(() => engine.go_to_step(engine.currentStep));
  }
}

document.querySelectorAll('.mobile-view-switcher button').forEach(btn => {
  btn.addEventListener('click', () => set_mobile_view(btn.dataset.mobileView));
});

DHLearning.visitChapter(CHAPTER_NUM);
update_chapter_progress();
load_current_algo(true);
</script>
