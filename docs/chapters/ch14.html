          "#include <stdio.h>",
          "#include <string.h>",
          "",
          "/* BF 暴力匹配算法 */",
          "int bf_search(const char *text, const char *pattern) {",
          "    int n = (int)strlen(text);",
          "    int m = (int)strlen(pattern);",
          "",
          "    if (m == 0) return 0;      /* 空模式串：约定匹配在起始位置 */",
          "    if (n < m) return -1;      /* 模式串比文本还长，不可能匹配 */",
          "    ",
          "    for (int i = 0; i <= n - m; i++) {",
          "        int j = 0;",
          "        for (; j < m; j++) {",
          "            if (text[i + j] != pattern[j]) {",
          "                break;  /* 不匹配，跳出内层循环 */",
          "            }",
          "        }",
          "        if (j == m) {",
          "            return i;  /* 找到了，返回起始位置 */",
          "        }",
          "    }",
          "    return -1;  /* 没找到 */",
          "}",
          "",
          "int main(void) {",
          "    char text[] = \"ABABDABACDABABCABAB\";",
          "    char pattern[] = \"ABABCABAB\";",
          "    ",
          "    int pos = bf_search(text, pattern);",
          "    if (pos != -1) {",
          "        printf(\"匹配成功！起始位置：%d\\n\", pos);",
          "    } else {",
          "        printf(\"未找到匹配\\n\");",
          "    }",

          "#include <stdio.h>",
          "#include <string.h>",
          "",
          "/* 构建 next 数组 */",
          "void build_next(const char *pattern, int *next, int m) {",
          "    next[0] = -1;",
          "    int i = 0, j = -1;",
          "    ",
          "    while (i < m - 1) {",
          "        if (j == -1 || pattern[i] == pattern[j]) {",
          "            i++;",
          "            j++;",
          "            next[i] = j;",
          "        } else {",
          "            j = next[j];  /* 回退！这里用到了已经算好的 next 值 */",
          "        }",
          "    }",
          "}",
          "",
          "/* 测试：构建 KMP next 数组 */",
          "int main(void) {",
          "    char pattern[] = \"ABABCABAB\";",
          "    int m = (int)strlen(pattern);",
          "    int next[100];",
          "",
          "    build_next(pattern, next, m);",
          "",
          "    printf(\"模式串：%s\\n\", pattern);",
          "    printf(\"next 数组：\");",
          "    for (int i = 0; i < m; i++) printf(\"%d \", next[i]);",
          "    printf(\"\\n\\n说明：next[i] 表示 pattern[0..i - 1] 的最长相同前后缀长度\\n\");",

          "#include <stdio.h>",
          "#include <string.h>",
          "#include <stdlib.h>",
          "",
          "void build_next(const char *pattern, int *next, int m) {",
          "    next[0] = -1;",
          "    int i = 0, j = -1;",
          "    while (i < m - 1) {",
          "        if (j == -1 || pattern[i] == pattern[j]) {",
          "            i++;",
          "            j++;",
          "            next[i] = j;",
          "        } else {",
          "            j = next[j];",
          "        }",
          "    }",
          "}",
          "",
          "/* KMP 匹配算法 */",
          "int kmp_search(const char *text, const char *pattern) {",
          "    int n = (int)strlen(text);",
          "    int m = (int)strlen(pattern);",
          "",
          "    if (m == 0) return 0;      /* 空模式串：约定匹配在起始位置 */",
          "    if (n < m) return -1;      /* 模式串比文本还长，不可能匹配 */",
          "",
          "    int *next = (int *)malloc(m * sizeof(int));",
          "    if (next == NULL) {",
          "        printf(\"内存分配失败\\n\");",
          "        return -1;",
          "    }",
          "    ",
          "    build_next(pattern, next, m);",
          "    ",
          "    int i = 0, j = 0;  /* i 是 text 的指针，j 是 pattern 的指针 */",
          "    while (i < n && j < m) {",
          "        if (j == -1 || text[i] == pattern[j]) {",
          "            i++;",
          "            j++;",
          "        } else {",
          "            j = next[j];  /* 模式串回退，文本指针不动！ */",
          "        }",
          "    }",
          "    ",
          "    free(next);",
          "    ",
          "    if (j == m) {",
          "        return i - m;  /* 找到了，返回起始位置 */",
          "    }",
          "    return -1;",
          "}",
          "",
          "int main(void) {",
          "    char text[] = \"ABABDABACDABABCABAB\";",
          "    char pattern[] = \"ABABCABAB\";",
          "    ",
          "    int pos = kmp_search(text, pattern);",
          "    if (pos != -1) {",
          "        printf(\"KMP 匹配成功！起始位置：%d\\n\", pos);",
          "    } else {",
          "        printf(\"未找到匹配\\n\");",
          "    }",
          "    return 0;",
          "}",

          "",
          "/* 构建 next 数组（用于对比） */",
          "void build_next(const char *pattern, int *next, int m) {",
          "    next[0] = -1;",
          "    int i = 0, j = -1;",
          "    while (i < m - 1) {",
          "        if (j == -1 || pattern[i] == pattern[j]) {",
          "            i++;",
          "            j++;",
          "            next[i] = j;",
          "        } else {",
          "            j = next[j];",
          "        }",
          "    }",
          "}",
          "",
          "/* 构建 nextval 数组（KMP 终极优化） */",
          "void build_nextval(const char *pattern, int *nextval, int m) {",
          "    nextval[0] = -1;",
          "    int i = 0, j = -1;",
          "    while (i < m - 1) {",
          "        if (j == -1 || pattern[i] == pattern[j]) {",
          "            i++;",
          "            j++;",
          "            /* 关键区别：如果回退位置的字符和当前位置相同，",
          "             * 回退过去必然再次失配，直接再跳一步 */",
          "            if (pattern[i] != pattern[j]) {",
          "                nextval[i] = j;",
          "            } else {",
          "                nextval[i] = nextval[j];",
          "            }",
          "        } else {",
          "            j = nextval[j];",
          "        }",
          "    }",
          "}",

        "title": "Rabin–Karp（哈希匹配）",
        "source": [
          "#include <stdio.h>",
          "#include <string.h>",
          "",
          "#define BASE 256    /* 字符集大小 */",
          "#define MOD  1000000007  /* 大素数 10^9 + 7，减少哈希冲突 */",
          "",
          "/* Rabin-Karp 算法 */",
          "void rabin_karp(const char *text, const char *pattern) {",
          "    int n = (int)strlen(text);",
          "    int m = (int)strlen(pattern);",
          "",
          "    if (m == 0) {",
          "        printf(\"匹配成功！起始位置：0\\n\");",
          "        return;",
          "    }",
          "    if (n < m) {",
          "        return;",
          "    }",
          "    ",
          "    /* 计算 BASE^(m - 1) % MOD，用于滚动时减去最高位 */",
          "    long long h = 1;",
          "    for (int i = 0; i < m - 1; i++) {",
          "        h = (h * BASE) % MOD;",
          "    }",
          "    ",
          "    /* 计算模式串和文本第一个窗口的哈希值 */",
          "    long long hash_p = 0;  /* 模式串的哈希 */",
          "    long long hash_t = 0;  /* 文本当前窗口的哈希 */",
          "    for (int i = 0; i < m; i++) {",
          "        hash_p = (BASE * hash_p + (unsigned char)pattern[i]) % MOD;",
          "        hash_t = (BASE * hash_t + (unsigned char)text[i]) % MOD;",
          "    }",
          "    ",
          "    /* 滑动窗口 */",
          "    for (int i = 0; i <= n - m; i++) {",
          "        /* 哈希值匹配，逐字符确认 */",
          "        if (hash_p == hash_t) {",
          "            int j;",
          "            for (j = 0; j < m; j++) {",
          "                if (text[i + j] != pattern[j]) {",
          "                    break;",
          "                }",
          "            }",
          "            if (j == m) {",
          "                printf(\"匹配成功！起始位置：%d\\n\", i);",
          "            }",
          "        }",
          "        ",
          "        /* 滚动计算下一个窗口的哈希 */",
          "        if (i < n - m) {",
          "            long long lead = (unsigned char)text[i];",
          "            long long tail = (unsigned char)text[i + m];",
          "            hash_t = (BASE * (hash_t - lead * h) + tail) % MOD;",
          "            /* C 语言取模可能得到负数，修正为非负 */",
          "            if (hash_t < 0) {",
          "                hash_t += MOD;",
          "            }",
          "        }",
          "    }",
          "}",
          "",
          "int main(void) {",
          "    char text[] = \"ABABDABACDABABCABAB\";",
          "    char pattern[] = \"ABABCABAB\";",
          "    ",
          "    printf(\"Rabin-Karp 匹配结果：\\n\");",
          "    rabin_karp(text, pattern);",
          "    return 0;",
          "}",

        "title": "Trie字典树",
        "source": [
          "#include <stdio.h>",
          "#include <stdlib.h>",
          "#include <string.h>",
          "#include <stdbool.h>",
          "",
          "#define ALPHABET_SIZE 26  /* 假设只处理小写字母 */",
          "",
          "/* Trie 树节点 */",
          "typedef struct TrieNode {",
          "    struct TrieNode *children[ALPHABET_SIZE];",
          "    bool is_end;  /* 是否是某个单词的结尾 */",
          "} TrieNode;",
          "",
          "/* 创建新节点 */",
          "TrieNode *create_node(void) {",
          "    TrieNode *node = (TrieNode *)malloc(sizeof(TrieNode));",
          "    if (node == NULL) {",
          "        printf(\"内存分配失败\\n\");",
          "        exit(1);",
          "    }",
          "    node->is_end = false;",
          "    for (int i = 0; i < ALPHABET_SIZE; i++) {",
          "        node->children[i] = NULL;",
          "    }",
          "    return node;",
          "}",
          "",
          "/* 插入单词：本示例只处理 'a' 到 'z' */",
          "void trie_insert(TrieNode *root, const char *word) {",
          "    TrieNode *cur = root;",
          "    for (int i = 0; word[i] != '\\0'; i++) {",
          "        int idx = word[i] - 'a';",
          "        if (idx < 0 || idx >= ALPHABET_SIZE) {",
          "            continue;  /* 简化处理：跳过非小写字母 */",
          "        }",
          "        if (cur->children[idx] == NULL) {",
          "            cur->children[idx] = create_node();",
          "        }",
          "        cur = cur->children[idx];",
          "    }",
          "    cur->is_end = true;",
          "}",
          "",
          "/* 查找单词 */",
          "bool trie_search(TrieNode *root, const char *word) {",
          "    TrieNode *cur = root;",
          "    for (int i = 0; word[i] != '\\0'; i++) {",
          "        int idx = word[i] - 'a';",
          "        if (idx < 0 || idx >= ALPHABET_SIZE) {",
          "            return false;",
          "        }",
          "        if (cur->children[idx] == NULL) {",
          "            return false;  /* 路径断了，不存在 */",
          "        }",
          "        cur = cur->children[idx];",
          "    }",
          "    return cur->is_end;  /* 必须是完整单词的结尾 */",
          "}",
          "",
          "/* 检查是否存在以 prefix 为前缀的单词 */",
          "bool trie_starts_with(TrieNode *root, const char *prefix) {",
          "    TrieNode *cur = root;",
          "    for (int i = 0; prefix[i] != '\\0'; i++) {",
          "        int idx = prefix[i] - 'a';",
          "        if (idx < 0 || idx >= ALPHABET_SIZE) {",
          "            return false;",
          "        }",
          "        if (cur->children[idx] == NULL) {",
          "            return false;",
          "        }",
          "        cur = cur->children[idx];",
          "    }",
          "    return true;",
          "}",
          "",
          "/* 释放 Trie 树 */",
          "void trie_free(TrieNode *root) {",
          "    if (root == NULL) return;",
          "    for (int i = 0; i < ALPHABET_SIZE; i++) {",
          "        trie_free(root->children[i]);",
          "    }",
          "    free(root);",
          "}",
          "",
          "int main(void) {",
          "    TrieNode *root = create_node();",
          "    ",
          "    /* 插入一些单词 */",
          "    trie_insert(root, \"apple\");",
          "    trie_insert(root, \"app\");",
          "    trie_insert(root, \"ape\");",
          "    trie_insert(root, \"bat\");",
          "    ",
          "    /* 查找 */",
          "    printf(\"查找 'apple': %s\\n\", trie_search(root, \"apple\") ? \"找到\" : \"未找到\");",
          "    printf(\"查找 'app': %s\\n\", trie_search(root, \"app\") ? \"找到\" : \"未找到\");",
          "    printf(\"查找 'apex': %s\\n\", trie_search(root, \"apex\") ? \"找到\" : \"未找到\");",
          "    printf(\"前缀 'ap': %s\\n\", trie_starts_with(root, \"ap\") ? \"存在\" : \"不存在\");",
          "    ",
          "    trie_free(root);",
          "    return 0;",
          "}",
          ""

        "source": [
          "#include <stdio.h>",
          "#include <stdlib.h>",
          "#include <string.h>",
          "",
          "#define ALPHABET_SIZE 26",
          "#define MAX_QUEUE 10000",
          "",
          "typedef struct ACNode {",
          "    struct ACNode *children[ALPHABET_SIZE];",
          "    struct ACNode *fail;",
          "    int count;",
          "} ACNode;",
          "",
          "/* 创建节点 */",
          "ACNode *create_node(void) {",
          "    ACNode *node = (ACNode *)calloc(1, sizeof(ACNode));",
          "    if (node == NULL) {",
          "        printf(\"内存分配失败\\n\");",
          "        exit(1);",
          "    }",
          "    return node;",
          "}",
          "",
          "/* 插入模式串 */",
          "void insert(ACNode *root, const char *word) {",
          "    ACNode *cur = root;",
          "",
          "    for (int i = 0; word[i]; i++) {",
          "        int idx = word[i] - 'a';",
          "        if (idx < 0 || idx >= ALPHABET_SIZE) {",
          "            continue;  /* 简化处理：跳过非小写字母 */",
          "        }",
          "",
          "        if (!cur->children[idx]) {",
          "            cur->children[idx] = create_node();",
          "        }",
          "",
          "        cur = cur->children[idx];",
          "    }",
          "",
          "    cur->count++;",
          "}",
          "",
          "/* BFS 构建 fail 指针 */",
          "void build_fail(ACNode *root) {",
          "    ACNode *queue[MAX_QUEUE];",
          "    int front = 0, rear = 0;",
          "",
          "    root->fail = root;",
          "",
          "    /* 第一层 fail 指向 root */",
          "    for (int i = 0; i < ALPHABET_SIZE; i++) {",
          "        if (root->children[i]) {",
          "            root->children[i]->fail = root;",
          "            if (rear >= MAX_QUEUE) {",
          "                printf(\"队列容量不足\\n\");",
          "                exit(1);",
          "            }",
          "            queue[rear++] = root->children[i];",
          "        }",
          "    }",
          "",
          "    while (front < rear) {",
          "        ACNode *cur = queue[front++];",
          "",
          "        for (int i = 0; i < ALPHABET_SIZE; i++) {",
          "            ACNode *child = cur->children[i];",
          "",
          "            if (!child) continue;",
          "",
          "            ACNode *p = cur->fail;",
          "",
          "            while (p != root && !p->children[i]) {",
          "                p = p->fail;",
          "            }",
          "",
          "            if (p->children[i] && p->children[i] != child) {",
          "                child->fail = p->children[i];",
          "            } else {",
          "                child->fail = root;",
          "            }",
          "",
          "            /* 继承 fail 链上的匹配 */",
          "            child->count += child->fail->count;",
          "",
          "            if (rear >= MAX_QUEUE) {",
          "                printf(\"队列容量不足\\n\");",
          "                exit(1);",
          "            }",
          "            queue[rear++] = child;",
          "        }",
          "    }",
          "}",
          "",
          "/* 搜索 */",
          "int ac_search(ACNode *root, const char *text) {",
          "    ACNode *cur = root;",
          "    int total = 0;",
          "",
          "    for (int i = 0; text[i]; i++) {",
          "        int idx = text[i] - 'a';",
          "        if (idx < 0 || idx >= ALPHABET_SIZE) {",
          "            cur = root;",
          "            continue;",
          "        }",
          "",
          "        while (cur != root && !cur->children[idx]) {",
          "            cur = cur->fail;",
          "        }",
          "",
          "        if (cur->children[idx]) {",
          "            cur = cur->children[idx];",
          "        }",
          "",
          "        total += cur->count;",
          "    }",
          "",
          "    return total;",
          "}",
          "",
          "void ac_free(ACNode *root) {",
          "    if (root == NULL) return;",
          "    for (int i = 0; i < ALPHABET_SIZE; i++) {",
          "        ac_free(root->children[i]);",
          "    }",
          "    free(root);",
          "}",
          "",
          "int main(void) {",

          "",

const firstKey = Object.keys(ALGOS)[0];
const requestedKey = new URLSearchParams(location.search).get('algo');
const savedAtOpen = DHLearning.load();
let currentKey = ALGOS[requestedKey]
  ? requestedKey
  : (savedAtOpen.last && savedAtOpen.last.chapter === CHAPTER_NUM && ALGOS[savedAtOpen.last.algorithm]
      ? savedAtOpen.last.algorithm
      : firstKey);
let currentMode = null;
const engine = new TraceEngine('viz-canvas', 'code-body', 'var-grid', 'callstack');
const tabsEl = document.getElementById('algo-tabs');
const modeTabsEl = document.getElementById('mode-tabs');

function has_modes(algo) {
  return algo && algo.modes && typeof algo.modes === 'object';
}

function mode_label(rawAlgo, mode) {
  const labels = rawAlgo.modeLabels || {};
  if (labels[mode]) return labels[mode];
  if (mode === 'concept') return '理解动画';
  if (mode === 'trace') return '代码执行';
  return mode;
}

function resolve_algo(rawAlgo) {
  if (!has_modes(rawAlgo)) return rawAlgo;
  const mode = currentMode || rawAlgo.defaultMode || Object.keys(rawAlgo.modes)[0];
  return rawAlgo.modes[mode] || rawAlgo.modes[rawAlgo.defaultMode] || Object.values(rawAlgo.modes)[0];
}

function is_concept_algo(algo) {
  if (!algo) return false;
  const classes = algo.var_classes || {};
  if (Object.values(classes).some(info => info && info.type === 'concept')) return true;
  return (algo.steps || []).some(step => step.vars && step.vars.concept);
}

function update_tab_states() {
  const completed = new Set(DHLearning.load().completedDemos);
  tabsEl.querySelectorAll('.algo-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.key === currentKey);
    btn.classList.toggle('completed', completed.has(DHLearning.demoId(CHAPTER_NUM, btn.dataset.key)));
    btn.setAttribute('aria-selected', String(btn.dataset.key === currentKey));
  });
}

function update_chapter_progress() {
  const state = DHLearning.load();
  const completed = new Set(state.completedDemos);
  const keys = Object.keys(ALGOS);
  const done = keys.filter(key => completed.has(DHLearning.demoId(CHAPTER_NUM, key))).length;
  document.getElementById('chapter-progress-text').textContent = `${done} / ${keys.length} 个演示完成`;
  document.getElementById('chapter-progress-fill').style.width = `${keys.length ? done / keys.length * 100 : 0}%`;
  update_tab_states();
}

function render_mode_tabs(rawAlgo) {
  modeTabsEl.innerHTML = '';
  if (!has_modes(rawAlgo)) {
    modeTabsEl.classList.remove('visible');
    currentMode = null;
    return;
  }
  modeTabsEl.classList.add('visible');
  const label = document.createElement('span');
  label.className = 'mode-label';
  label.textContent = '学习方式';
  modeTabsEl.appendChild(label);
  const activeMode = currentMode || rawAlgo.defaultMode || Object.keys(rawAlgo.modes)[0];
  Object.keys(rawAlgo.modes).forEach(mode => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'mode-tab' + (mode === activeMode ? ' active' : '');
    btn.textContent = mode_label(rawAlgo, mode);
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', String(mode === activeMode));
    btn.addEventListener('click', () => {
      if (currentMode === mode) return;
      currentMode = mode;
      load_current_algo(false);
      if (matchMedia('(max-width: 900px)').matches) {
        set_mobile_view(mode === 'trace' ? 'code' : 'animation');
      }
    });
    modeTabsEl.appendChild(btn);
  });
}

function load_current_algo(allowRestore = true) {
  const rawAlgo = ALGOS[currentKey];
  const beforeLoad = DHLearning.load().last;
  if (has_modes(rawAlgo)) {
    const savedMode = beforeLoad && beforeLoad.chapter === CHAPTER_NUM && beforeLoad.algorithm === currentKey
      ? beforeLoad.mode
      : null;
    if (!currentMode) currentMode = savedMode && rawAlgo.modes[savedMode]
      ? savedMode
      : (rawAlgo.defaultMode || Object.keys(rawAlgo.modes)[0]);
  } else {
    currentMode = null;
  }
  render_mode_tabs(rawAlgo);
  const activeAlgo = resolve_algo(rawAlgo);
  document.body.classList.toggle('concept-mode', currentMode === 'concept' || is_concept_algo(activeAlgo));
  engine.stop_play();
  engine.load(activeAlgo);
  try {
    const currentUrl = new URL(location.href);
    currentUrl.searchParams.set('algo', currentKey);
    history.replaceState(null, '', currentUrl.href);
  } catch (_) {
    // file:// 预览环境可能限制 history API，不影响演示本身。
  }
  update_tab_states();

  if (
    allowRestore
    && beforeLoad
    && beforeLoad.chapter === CHAPTER_NUM
    && beforeLoad.algorithm === currentKey
    && beforeLoad.mode === currentMode
    && beforeLoad.step > 0
    && activeAlgo.steps.length
  ) {
    const restoreStep = Math.min(beforeLoad.step, activeAlgo.steps.length - 1);
    requestAnimationFrame(() => engine.go_to_step(restoreStep));
  }
}

Object.entries(ALGOS).forEach(([key, algo]) => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'algo-tab';
  btn.dataset.key = key;
  btn.textContent = algo.title;
  btn.setAttribute('role', 'tab');
  btn.setAttribute('aria-selected', String(key === currentKey));
  btn.addEventListener('click', () => {
    if (currentKey === key) return;
    currentKey = key;
    currentMode = has_modes(algo) ? (algo.defaultMode || Object.keys(algo.modes)[0]) : null;
    load_current_algo(true);
  });
  tabsEl.appendChild(btn);
});

document.addEventListener('dh:stepchange', event => {
  const detail = event.detail || {};
  DHLearning.updateLast(CHAPTER_NUM, currentKey, currentMode, detail.currentStep);
  if (detail.atEnd) DHLearning.markDemoComplete(CHAPTER_NUM, currentKey);
  update_chapter_progress();
});

document.getElementById('btn-play').addEventListener('click', () => engine.playing ? engine.stop_play() : engine.start_play());
document.getElementById('btn-step').addEventListener('click', () => { engine.stop_play(); engine.step_forward(); });
document.getElementById('btn-reset').addEventListener('click', () => engine.reset());
document.getElementById('btn-back').addEventListener('click', () => { engine.stop_play(); engine.step_backward(); });
document.getElementById('btn-to-bp').addEventListener('click', () => { engine.stop_play(); engine.play_to_bp(); });

const speedSlider = document.getElementById('speed-slider');
const savedSpeed = localStorage.getItem('dh_speed');
if (savedSpeed !== null) speedSlider.value = savedSpeed;
speedSlider.setAttribute('aria-valuetext', `速度 ${speedSlider.value}`);
speedSlider.addEventListener('input', () => {
  localStorage.setItem('dh_speed', speedSlider.value);
  speedSlider.setAttribute('aria-valuetext', `速度 ${speedSlider.value}`);
  if (engine.playing) { clearTimeout(engine.playTimer); engine._play_loop(); }
});
speedSlider.addEventListener('keydown', event => {
  if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
  event.preventDefault();
  event.stopPropagation();
  const direction = event.key === 'ArrowRight' ? 1 : -1;
  speedSlider.value = String(Math.max(Number(speedSlider.min), Math.min(Number(speedSlider.max), Number(speedSlider.value) + direction)));
  speedSlider.dispatchEvent(new Event('input', { bubbles: true }));
});
document.getElementById('font-dec').addEventListener('click', () => engine.font_dec());
document.getElementById('font-inc').addEventListener('click', () => engine.font_inc());

document.addEventListener('keydown', event => {
  const target = event.target;
  if (target && target.closest && target.closest('button,input,select,textarea,a,summary,[contenteditable="true"]')) return;
  if (event.key === ' ') {
    event.preventDefault();
    engine.playing ? engine.stop_play() : engine.start_play();
  } else if (event.key === 'ArrowRight') {
    event.preventDefault();
    engine.stop_play();
    engine.step_forward();
  } else if (event.key === 'ArrowLeft') {
    event.preventDefault();
    engine.stop_play();
    engine.step_backward();
  } else if (event.key.toLowerCase() === 'r' && !event.metaKey && !event.ctrlKey && !event.altKey) {
    engine.reset();
  }
});

function set_mobile_view(view) {
  document.body.dataset.mobileView = view;
  document.querySelectorAll('.mobile-view-switcher button').forEach(btn => {
    const active = btn.dataset.mobileView === view;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-selected', String(active));
  });
  if (view === 'animation' && engine.currentStep >= 0) {
    requestAnimationFrame(() => engine.go_to_step(engine.currentStep));
  }
}

document.querySelectorAll('.mobile-view-switcher button').forEach(btn => {
  btn.addEventListener('click', () => set_mobile_view(btn.dataset.mobileView));
});

DHLearning.visitChapter(CHAPTER_NUM);
update_chapter_progress();
load_current_algo(true);
</script>
</body>
</html>
