.btn {

        "title": "Dijkstra（朴素版）",
        "source": [
          "#include <stdio.h>",
          "#include <limits.h>",
          "",
          "#define MAX_V 1000",
          "#define INF 0x3f3f3f3f  /* 约 10 亿，两个 INF 相加也不会溢出 int */",
          "",
          "/* 简化版：用邻接矩阵，朴素 O(V^2) 实现",
          " * 约定：graph[u][v] == 0 表示无边，因此本教学版不支持 0 权边。 */",
          "void dijkstra(int graph[][MAX_V], int V, int src) {",
          "    int dist[MAX_V];    /* 起点到各顶点的当前最短距离 */",
          "    int visited[MAX_V]; /* 是否已经确定最短距离 */",
          "    ",
          "    for (int i = 0; i < V; i++) {",
          "        dist[i] = INF;",
          "        visited[i] = 0;",
          "    }",
          "    dist[src] = 0;",
          "    ",
          "    for (int count = 0; count < V; count++) {",
          "        int u = -1;",
          "        int minDist = INF;",
          "",
          "        /* 找出当前距离最小的未确定顶点 */",
          "        for (int v = 0; v < V; v++) {",
          "            if (!visited[v] && dist[v] < minDist) {",
          "                minDist = dist[v];",
          "                u = v;",
          "            }",
          "        }",
          "        ",
          "        if (u == -1) break; /* 剩余顶点不可达 */",
          "        visited[u] = 1;",
          "        ",
          "        /* 用 u 去更新其他顶点 */",
          "        for (int v = 0; v < V; v++) {",
          "            /* 若允许 0 权边，应改用 hasEdge[u][v] 或邻接表判断边是否存在 */",
          "            if (!visited[v] && graph[u][v] != 0) {",
          "                int newDist = dist[u] + graph[u][v];",
          "                if (newDist < dist[v]) {",
          "                    dist[v] = newDist;",
          "                }",
          "            }",
          "        }",
          "    }",
          "    ",
          "    printf(\"从顶点 %d 出发的最短距离：\\n\", src);",
          "    for (int i = 0; i < V; i++) {",
          "        if (dist[i] == INF)",
          "            printf(\"到顶点 %d: 不可达\\n\", i);",
          "        else",
          "            printf(\"到顶点 %d: %d\\n\", i, dist[i]);",
          "    }",
          "}",
          "",
          "",
          "/* 测试：Dijkstra 朴素版最短路径 */",
          "int main(void) {",
          "    int V = 5;",
          "    int graph[MAX_V][MAX_V] = {0};",
          "",
          "    /* 构建测试图（邻接矩阵，0 表示无边） */",
          "    graph[0][1] = 10; graph[0][2] = 3;",
          "    graph[1][2] = 1;  graph[1][3] = 2;",
          "    graph[2][1] = 4;  graph[2][3] = 8; graph[2][4] = 2;",
          "    graph[3][4] = 7;",
          "    graph[4][3] = 9;",
          "",
          "    printf(\"图结构（5 个顶点）：\\n\");",
          "    printf(\"  0 --10--> 1,  0 --3--> 2\\n\");",
          "    printf(\"  1 --1--> 2,   1 --2--> 3\\n\");",
          "    printf(\"  2 --4--> 1,   2 --8--> 3,  2 --2--> 4\\n\");",
          "    printf(\"  3 --7--> 4\\n\\n\");",
          "",
          "    dijkstra(graph, V, 0);",
          "",
          "    return 0;",
          "}",

          "#include <stdlib.h>",

          "#define MAX_V 1000",
          "#define MAX_E 5000",
          "#define INF 0x3f3f3f3f",
          "",
          "/* 邻接表节点：只存真实存在的边，适合稀疏图 */",
          "typedef struct EdgeNode {",
          "    int to;",
          "    int weight;",
          "    struct EdgeNode* next;",
          "} EdgeNode;",
          "",
          "/* 最小堆节点：按当前距离排序 */",
          "typedef struct {",
          "    int vertex;",
          "    int dist;",
          "} HeapNode;",
          "",
          "HeapNode heap[MAX_E + MAX_V];",
          "int heapSize = 0;",
          "",
          "void swap(HeapNode* a, HeapNode* b) {",
          "    HeapNode t = *a;",
          "    *a = *b;",
          "    *b = t;",
          "}",
          "",
          "void push(int vertex, int dist) {",
          "    if (heapSize >= MAX_E + MAX_V) {",
          "        printf(\"堆空间不足\\n\");",
          "        exit(1);",
          "    }",
          "",
          "    int i = heapSize++;",
          "    heap[i].vertex = vertex;",
          "    heap[i].dist = dist;",
          "",
          "    while (i > 0) {",
          "        int parent = (i - 1) / 2;",
          "        if (heap[parent].dist <= heap[i].dist) break;",
          "        swap(&heap[parent], &heap[i]);",
          "        i = parent;",
          "    }",
          "}",
          "",
          "HeapNode pop_min(void) {",
          "    HeapNode ret = heap[0];",
          "    heap[0] = heap[--heapSize];",
          "",
          "    int i = 0;",
          "    while (1) {",
          "        int left = i * 2 + 1;",
          "        int right = i * 2 + 2;",
          "        int smallest = i;",
          "",
          "        if (left < heapSize && heap[left].dist < heap[smallest].dist)",
          "            smallest = left;",
          "        if (right < heapSize && heap[right].dist < heap[smallest].dist)",
          "            smallest = right;",
          "        if (smallest == i) break;",
          "",
          "        swap(&heap[i], &heap[smallest]);",
          "        i = smallest;",
          "    }",
          "",
          "    return ret;",
          "}",
          "",
          "void add_edge(EdgeNode* graph[], int from, int to, int weight) {",
          "    EdgeNode* node = (EdgeNode*)malloc(sizeof(EdgeNode));",
          "    if (node == NULL) {",
          "        printf(\"内存分配失败\\n\");",
          "        exit(1);",
          "    }",
          "    node->to = to;",
          "    node->weight = weight;",
          "    node->next = graph[from];",
          "    graph[from] = node;",
          "}",
          "",
          "void dijkstra_heap(EdgeNode* graph[], int V, int src) {",
          "    int dist[MAX_V];",
          "    int visited[MAX_V];",
          "",
          "    for (int i = 0; i < V; i++) {",
          "        dist[i] = INF;",
          "        visited[i] = 0;",
          "    }",
          "",
          "    heapSize = 0;",
          "    dist[src] = 0;",
          "    push(src, 0);",
          "",
          "    while (heapSize > 0) {",
          "        HeapNode cur = pop_min();",
          "        int u = cur.vertex;",
          "",
          "        if (visited[u]) continue;  /* 堆里可能有旧距离，跳过即可 */",
          "        visited[u] = 1;",
          "",
          "        for (EdgeNode* e = graph[u]; e != NULL; e = e->next) {",
          "            int v = e->to;",
          "            int w = e->weight;",
          "            if (!visited[v] && dist[u] != INF && dist[u] + w < dist[v]) {",
          "                dist[v] = dist[u] + w;",
          "                push(v, dist[v]);",
          "            }",
          "        }",
          "    }",
          "",
          "    printf(\"堆优化 Dijkstra 从顶点 %d 出发的最短距离：\\n\", src);",
          "    for (int i = 0; i < V; i++) {",
          "        if (dist[i] == INF)",
          "            printf(\"到顶点 %d: 不可达\\n\", i);",
          "        else",
          "            printf(\"到顶点 %d: %d\\n\", i, dist[i]);",
          "    }",
          "}",
          "",
          "void free_graph(EdgeNode* graph[], int V) {",
          "    for (int i = 0; i < V; i++) {",
          "        EdgeNode* p = graph[i];",
          "        while (p != NULL) {",
          "            EdgeNode* next = p->next;",
          "            free(p);",
          "            p = next;",
          "        }",
          "    }",
          "}",
          "",
          "/* 测试：稀疏图上的 Dijkstra 堆优化版 */",
          "int main(void) {",
          "    int V = 5;",
          "    EdgeNode* graph[MAX_V] = {NULL};",
          "",
          "    add_edge(graph, 0, 1, 10);",
          "    add_edge(graph, 0, 2, 3);",
          "    add_edge(graph, 1, 2, 1);",
          "    add_edge(graph, 1, 3, 2);",
          "    add_edge(graph, 2, 1, 4);",
          "    add_edge(graph, 2, 3, 8);",
          "    add_edge(graph, 2, 4, 2);",
          "    add_edge(graph, 3, 4, 7);",
          "    add_edge(graph, 4, 3, 9);",
          "",
          "    printf(\"稀疏图：5 个顶点，9 条有向边\\n\");",
          "    dijkstra_heap(graph, V, 0);",
          "",
          "    free_graph(graph, V);",
          "    return 0;",
          "}",
          ""
        ],

          "    ",
          "    /* 初始化 */",
          "    for (int i = 0; i < V; i++)",
          "        dist[i] = INF;",
          "    dist[src] = 0;",
          "    ",
          "    /* 松弛 V - 1 轮 */",
          "    for (int i = 0; i < V - 1; i++) {",
          "        int updated = 0;",
          "        for (int j = 0; j < E; j++) {",
          "            int u = edges[j].src;",
          "            int v = edges[j].dest;",
          "            int w = edges[j].weight;",
          "            if (dist[u] != INF && dist[u] + w < dist[v]) {",
          "                dist[v] = dist[u] + w;",
          "                updated = 1;",
          "            }",
          "        }",
          "        if (!updated) break;  /* 这一轮没有任何更新，提前结束 */",
          "    }",
          "    ",
          "    /* 检测负权环：再松弛一轮，如果还有更新，说明有从源点可达的负权环 */",
          "    for (int j = 0; j < E; j++) {",
          "        int u = edges[j].src;",
          "        int v = edges[j].dest;",
          "        int w = edges[j].weight;",
          "        if (dist[u] != INF && dist[u] + w < dist[v]) {",
          "            printf(\"警告：存在从源点可达的负权环！\\n\");",
          "            return;",
          "        }",
          "    }",

          "    /* 输出结果 */",
          "    for (int i = 0; i < V; i++) {",
          "        if (dist[i] == INF)",
          "            printf(\"到顶点 %d: 不可达\\n\", i);",
          "        else",
          "            printf(\"到顶点 %d: %d\\n\", i, dist[i]);",
          "    }",
          "}",

          "    int V = 5, E = 8;",

          "    printf(\"边的条数：%d（含负权边）\\n\\n\", E);",
          "    bellman_ford(edges, V, E, 0);",
          "",
          "    return 0;",

        "source": [
          "#include <stdio.h>",
          "#include <stdlib.h>",
          "",
          "#define MAX_V 1000",
          "#define INF 0x3f3f3f3f",
          "",
          "/* 用邻接表存储图 */",
          "typedef struct Node {",
          "    int dest, weight;",
          "    struct Node* next;",
          "} Node;",
          "",
          "void spfa(Node* graph[], int V, int src) {",
          "    int dist[MAX_V];",
          "    int inQueue[MAX_V];  /* 是否已经在队列中 */",
          "    int count[MAX_V];    /* 入队次数，用于检测从源点可达的负权环 */",
          "    ",
          "    int queue[MAX_V];",
          "    int front = 0, rear = 0, qSize = 0;",
          "    ",
          "    for (int i = 0; i < V; i++) {",
          "        dist[i] = INF;",
          "        inQueue[i] = 0;",
          "        count[i] = 0;",
          "    }",
          "    dist[src] = 0;",
          "    ",
          "    /* 起点入队 */",
          "    queue[rear] = src;",
          "    rear = (rear + 1) % MAX_V;",
          "    qSize++;",
          "    inQueue[src] = 1;",
          "    count[src]++;",
          "    ",
          "    while (qSize > 0) {",
          "        int u = queue[front];",
          "        front = (front + 1) % MAX_V;",
          "        qSize--;",
          "        inQueue[u] = 0;",

          "#define MAX_V 100",

          "",
          "void floyd(int dist[][MAX_V], int V) {",
          "    /* 三重循环：k 是中转站 */",
          "    for (int k = 0; k < V; k++) {",
          "        for (int i = 0; i < V; i++) {",
          "            for (int j = 0; j < V; j++) {",
          "                /* 防溢出：只有两边都可达时才尝试更新 */",
          "                if (dist[i][k] != INF && dist[k][j] != INF &&",
          "                    dist[i][k] + dist[k][j] < dist[i][j]) {",
          "                    dist[i][j] = dist[i][k] + dist[k][j];",
          "                }",
          "            }",
          "        }",
          "    }",
          "}",

          "",

          "#include <stdio.h>",
          "",
          "#define MAX_V 10",
          "#define INF 0x3f3f3f3f",
          "",
          "/* Floyd 算法的距离矩阵初始化演示 */",
          "int main(void) {",
          "    int V = 5;",
          "    int graph[MAX_V][MAX_V] = {0};",
          "    int dist[MAX_V][MAX_V];",
          "",
          "    /* 先构建邻接矩阵。教学简化：0 表示无边，因此不能表达 0 权边。 */",
          "    graph[0][1] = 3; graph[0][2] = 8; graph[0][4] = -4;",
          "    graph[1][3] = 1; graph[1][4] = 7;",
          "    graph[2][1] = 4;",
          "    graph[3][0] = 2; graph[3][2] = -5;",
          "    graph[4][3] = 6;",
          "",
          "    /* dist[i][j] 初始化（Floyd 算法的第一步） */",
          "    for (int i = 0; i < V; i++) {",
          "        for (int j = 0; j < V; j++) {",
          "            if (i == j)",
          "                dist[i][j] = 0;           /* 自己到自己距离为 0 */",
          "            else if (graph[i][j] != 0)",
          "                dist[i][j] = graph[i][j];  /* 有边就用边的权重 */",
          "            else",
          "                dist[i][j] = INF;          /* 无边则无穷大 */",
          "        }",
          "    }",
          "",
          "    printf(\"Floyd 初始化后的距离矩阵：\\n\");",
          "    printf(\"（0=自己，INF=不可直达）\\n\\n\");",
          "    for (int i = 0; i < V; i++) {",
          "        for (int j = 0; j < V; j++) {",
          "            if (dist[i][j] == INF)",
          "                printf(\" INF\");",
          "            else",
          "                printf(\"%4d\", dist[i][j]);",
          "        }",
          "        printf(\"\\n\");",
          "    }",
          "",
          "    return 0;",
          "}",
          ""
        ],

const firstKey = Object.keys(ALGOS)[0];
const requestedKey = new URLSearchParams(location.search).get('algo');
const savedAtOpen = DHLearning.load();
let currentKey = ALGOS[requestedKey]
  ? requestedKey
  : (savedAtOpen.last && savedAtOpen.last.chapter === CHAPTER_NUM && ALGOS[savedAtOpen.last.algorithm]
      ? savedAtOpen.last.algorithm
      : firstKey);
let currentMode = null;
const engine = new TraceEngine('viz-canvas', 'code-body', 'var-grid', 'callstack');
const tabsEl = document.getElementById('algo-tabs');
const modeTabsEl = document.getElementById('mode-tabs');

function has_modes(algo) {
  return algo && algo.modes && typeof algo.modes === 'object';
}

function mode_label(rawAlgo, mode) {
  const labels = rawAlgo.modeLabels || {};
  if (labels[mode]) return labels[mode];
  if (mode === 'concept') return '理解动画';
  if (mode === 'trace') return '代码执行';
  return mode;
}

function resolve_algo(rawAlgo) {
  if (!has_modes(rawAlgo)) return rawAlgo;
  const mode = currentMode || rawAlgo.defaultMode || Object.keys(rawAlgo.modes)[0];
  return rawAlgo.modes[mode] || rawAlgo.modes[rawAlgo.defaultMode] || Object.values(rawAlgo.modes)[0];
}

function is_concept_algo(algo) {
  if (!algo) return false;
  const classes = algo.var_classes || {};
  if (Object.values(classes).some(info => info && info.type === 'concept')) return true;
  return (algo.steps || []).some(step => step.vars && step.vars.concept);
}

function update_tab_states() {
  const completed = new Set(DHLearning.load().completedDemos);
  tabsEl.querySelectorAll('.algo-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.key === currentKey);
    btn.classList.toggle('completed', completed.has(DHLearning.demoId(CHAPTER_NUM, btn.dataset.key)));
    btn.setAttribute('aria-selected', String(btn.dataset.key === currentKey));
  });
}

function update_chapter_progress() {
  const state = DHLearning.load();
  const completed = new Set(state.completedDemos);
  const keys = Object.keys(ALGOS);
  const done = keys.filter(key => completed.has(DHLearning.demoId(CHAPTER_NUM, key))).length;
  document.getElementById('chapter-progress-text').textContent = `${done} / ${keys.length} 个演示完成`;
  document.getElementById('chapter-progress-fill').style.width = `${keys.length ? done / keys.length * 100 : 0}%`;
  update_tab_states();
}

function render_mode_tabs(rawAlgo) {
  modeTabsEl.innerHTML = '';
  if (!has_modes(rawAlgo)) {
    modeTabsEl.classList.remove('visible');
    currentMode = null;
    return;
  }
  modeTabsEl.classList.add('visible');
  const label = document.createElement('span');
  label.className = 'mode-label';
  label.textContent = '学习方式';
  modeTabsEl.appendChild(label);
  const activeMode = currentMode || rawAlgo.defaultMode || Object.keys(rawAlgo.modes)[0];
  Object.keys(rawAlgo.modes).forEach(mode => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'mode-tab' + (mode === activeMode ? ' active' : '');
    btn.textContent = mode_label(rawAlgo, mode);
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', String(mode === activeMode));
    btn.addEventListener('click', () => {
      if (currentMode === mode) return;
      currentMode = mode;
      load_current_algo(false);
      if (matchMedia('(max-width: 900px)').matches) {
        set_mobile_view(mode === 'trace' ? 'code' : 'animation');
      }
    });
    modeTabsEl.appendChild(btn);
  });
}

function load_current_algo(allowRestore = true) {
  const rawAlgo = ALGOS[currentKey];
  const beforeLoad = DHLearning.load().last;
  if (has_modes(rawAlgo)) {
    const savedMode = beforeLoad && beforeLoad.chapter === CHAPTER_NUM && beforeLoad.algorithm === currentKey
      ? beforeLoad.mode
      : null;
    if (!currentMode) currentMode = savedMode && rawAlgo.modes[savedMode]
      ? savedMode
      : (rawAlgo.defaultMode || Object.keys(rawAlgo.modes)[0]);
  } else {
    currentMode = null;
  }
  render_mode_tabs(rawAlgo);
  const activeAlgo = resolve_algo(rawAlgo);
  document.body.classList.toggle('concept-mode', currentMode === 'concept' || is_concept_algo(activeAlgo));
  engine.stop_play();
  engine.load(activeAlgo);
  try {
    const currentUrl = new URL(location.href);
    currentUrl.searchParams.set('algo', currentKey);
    history.replaceState(null, '', currentUrl.href);
  } catch (_) {
    // file:// 预览环境可能限制 history API，不影响演示本身。
  }
  update_tab_states();

  if (
    allowRestore
    && beforeLoad
    && beforeLoad.chapter === CHAPTER_NUM
    && beforeLoad.algorithm === currentKey
    && beforeLoad.mode === currentMode
    && beforeLoad.step > 0
    && activeAlgo.steps.length
  ) {
    const restoreStep = Math.min(beforeLoad.step, activeAlgo.steps.length - 1);
    requestAnimationFrame(() => engine.go_to_step(restoreStep));
  }
}

Object.entries(ALGOS).forEach(([key, algo]) => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'algo-tab';
  btn.dataset.key = key;
  btn.textContent = algo.title;
  btn.setAttribute('role', 'tab');
  btn.setAttribute('aria-selected', String(key === currentKey));
  btn.addEventListener('click', () => {
    if (currentKey === key) return;
    currentKey = key;
    currentMode = has_modes(algo) ? (algo.defaultMode || Object.keys(algo.modes)[0]) : null;
    load_current_algo(true);
  });
  tabsEl.appendChild(btn);
});

document.addEventListener('dh:stepchange', event => {

  update_chapter_progress();
});

speedSlider.addEventListener('keydown', event => {
  if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
  event.preventDefault();
  event.stopPropagation();
  const direction = event.key === 'ArrowRight' ? 1 : -1;
  speedSlider.value = String(Math.max(Number(speedSlider.min), Math.min(Number(speedSlider.max), Number(speedSlider.value) + direction)));
  speedSlider.dispatchEvent(new Event('input', { bubbles: true }));
});

document.addEventListener('keydown', event => {
  const target = event.target;
  if (target && target.closest && target.closest('button,input,select,textarea,a,summary,[contenteditable="true"]')) return;
  if (event.key === ' ') {
    event.preventDefault();
    engine.playing ? engine.stop_play() : engine.start_play();
  } else if (event.key === 'ArrowRight') {
    event.preventDefault();
    engine.stop_play();
    engine.step_forward();
  } else if (event.key === 'ArrowLeft') {
    event.preventDefault();
    engine.stop_play();
    engine.step_backward();
  } else if (event.key.toLowerCase() === 'r' && !event.metaKey && !event.ctrlKey && !event.altKey) {
    engine.reset();
  }
});

function set_mobile_view(view) {
  document.body.dataset.mobileView = view;
  document.querySelectorAll('.mobile-view-switcher button').forEach(btn => {
    const active = btn.dataset.mobileView === view;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-selected', String(active));
  });
  if (view === 'animation' && engine.currentStep >= 0) {
    requestAnimationFrame(() => engine.go_to_step(engine.currentStep));
  }
}

document.querySelectorAll('.mobile-view-switcher button').forEach(btn => {
  btn.addEventListener('click', () => set_mobile_view(btn.dataset.mobileView));
});

DHLearning.visitChapter(CHAPTER_NUM);
update_chapter_progress();
load_current_algo(true);
</script>
