<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #1e2336;
  --panel: #1a1f30;
  --panel-deep: #151920;
  --surface: #21283a;
  --border: #30384c;
  --text: #d7dae0;
  --text-soft: #abb4c3;
  --text-dim: #929caf;
  --accent: #59a8ee;
  --accent-soft: #243f5e;
  --success: #98c379;
  --control-height: 64px;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text-soft);
  overflow: hidden;
}
button, input, summary { font: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
  outline: 3px solid rgba(89,168,238,.58);
  outline-offset: 2px;
}
.header {
  height: 65px;
  background: rgba(23,28,43,.96);
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 18px;
  position: relative;
  z-index: 30;
}
.back-link {
  color: var(--accent);
  text-decoration: none;
  font-size: 13px;
  white-space: nowrap;
}
.back-link:hover { text-decoration: underline; }
.chapter-heading { min-width: 0; flex: 1; }
.chapter-kicker { color: var(--text-dim); font-size: 12px; margin-bottom: 2px; }
.chapter-heading h1 {
  font-size: 19px;
  line-height: 1.25;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.chapter-status {
  min-width: 138px;
  display: grid;
  gap: 5px;
}
.chapter-status-text { color: var(--text-dim); font-size: 11px; text-align: right; }
.chapter-status-track { height: 4px; background: #252c3e; border-radius: 99px; overflow: hidden; }
.chapter-status-fill {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--accent), var(--success));
  border-radius: inherit;
  transition: width .3s ease;
}
.chapter-nav { display: flex; gap: 6px; }
.chapter-nav a, .chapter-nav span {
  min-width: 36px;
  height: 36px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-soft);
  text-decoration: none;
  font-size: 12px;
}
.chapter-nav a:hover { border-color: var(--accent); color: var(--text); background: #202b40; }
.chapter-nav .disabled { opacity: .35; cursor: default; }
.mobile-view-switcher { display: none; }
.main { display: flex; height: calc(100dvh - 65px); min-height: 0; }
.code-panel {
  width: 45%;
  min-width: 360px;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.code-header {
  background: var(--panel);
  padding: 9px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.algo-tabs {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  flex: 1;
  min-width: 0;
}
.algo-tab, .mode-tab {
  border: 1px solid var(--border);
  background: #22283a;
  color: var(--text-dim);
  border-radius: 7px;
  cursor: pointer;
  transition: background .18s ease, border-color .18s ease, color .18s ease;
}
.algo-tab { padding: 6px 11px; font-size: 12px; position: relative; }
.algo-tab:hover, .mode-tab:hover { color: var(--text); border-color: #48536b; }
.algo-tab.active, .mode-tab.active {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: #e8f3ff;
}
.algo-tab.completed::after {
  content: '✓';
  margin-left: 6px;
  color: var(--success);
  font-weight: 800;
}
.breakpoint-hint {
  color: #737e92;
  font-size: 11px;
  line-height: 29px;
  white-space: nowrap;
}
.mode-tabs {
  display: none;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  background: #171c2b;
  border-bottom: 1px solid var(--border);
}
.mode-tabs.visible { display: flex; }
.mode-label { font-size: 12px; color: var(--text-dim); margin-right: 2px; }
.mode-tab { padding: 5px 12px; border-radius: 999px; font-size: 12px; }
.code-body {
  flex: 1;
  min-height: 0;
  overflow: auto;
  font-family: 'SFMono-Regular', 'JetBrains Mono', 'Fira Code', Consolas, monospace;
  font-size: var(--code-font-size, 15px);
  line-height: 1.8;
  scrollbar-color: #3b455c transparent;
}
.code-line { display: flex; min-width: max-content; padding: 0 16px 0 7px; position: relative; }
.code-line:hover { background: #22283a; }
.code-line.active {
  background: rgba(73,164,238,.32);
  border-left: 3px solid var(--accent);
  box-shadow: inset 0 0 16px rgba(73,164,238,.18);
}
.code-line.executed { background: rgba(73,164,238,.035); }
.code-line.setup { background: rgba(127,132,142,.045); color: #667084; }
.line-num {
  width: 42px;
  border: 0;
  background: transparent;
  text-align: right;
  color: #748096;
  padding-right: 12px;
  user-select: none;
  flex-shrink: 0;
  position: relative;
  cursor: pointer;
}
.line-num:hover { color: var(--accent); }
.line-num .breakpoint {
  position: absolute;
  left: 3px;
  top: 50%;
  transform: translateY(-50%);
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #e05561;
}
.line-content { flex: 1; white-space: pre; }
.kw, .num { color: #F3A862; }
.fn { color: #59a8ee; }
.var { color: #D980FA; }
.str { color: #74C589; }
.cmt { color: #71939a; font-style: italic; }
.right-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
.viz-panel {
  flex: 3;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px 20px;
  position: relative;
  min-height: 0;
  overflow: hidden;
}
.viz-panel canvas { width: 100%; height: 100%; display: block; }
body.concept-mode .viz-panel { flex: 1 1 auto; padding: 6px 20px; }
body.concept-mode .vars-panel { flex: 0 1 168px; padding: 8px 18px; }
body.concept-mode .output-panel { flex: 0 1 68px; padding: 6px 16px; }
body.concept-mode .callstack { display: none; }
.callstack {
  position: absolute;
  top: 12px;
  left: 12px;
  max-width: calc(100% - 24px);
  background: rgba(33,38,54,.92);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 12px;
  pointer-events: none;
}
.callstack-title, .vars-panel h3, .output-panel h3 { color: var(--text-dim); }
.callstack-title { margin-bottom: 4px; }
.callstack-item { color: var(--accent); padding: 2px 0; }
.callstack-item::before { content: '▸ '; color: #68758a; }
.vars-panel {
  flex: 2;
  background: var(--panel);
  padding: 10px 18px;
  border-top: 1px solid var(--border);
  overflow-y: auto;
  min-height: 0;
}
.output-panel {
  flex: 1;
  background: var(--panel-deep);
  border-top: 1px solid var(--border);
  padding: 8px 16px;
  overflow-y: auto;
  min-height: 0;
  font-family: 'SFMono-Regular', 'JetBrains Mono', monospace;
  font-size: var(--output-font-size, 13px);
  color: var(--text-dim);
}
.output-panel h3 {
  font-size: 12px;
  margin-bottom: 4px;
  position: sticky;
  top: 0;
  background: var(--panel-deep);
  padding-bottom: 4px;
  z-index: 1;
}
.output-line { padding: 1px 0; white-space: pre-wrap; word-break: break-word; }
.vars-panel h3 { font-size: 13px; margin-bottom: 9px; }
.var-grid { display: flex; flex-direction: column; gap: 6px; }
.var-section-title { font-size: 11px; color: var(--text-dim); margin: 8px 0 4px; }
.var-section:first-child .var-section-title { margin-top: 0; }
.var-row { display: flex; flex-wrap: wrap; gap: 6px; }
.var-item {
  background: #22283a;
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 6px 13px;
  font-family: monospace;
  font-size: var(--var-font-size, 14px);
}
.var-name { color: var(--accent); }
.var-val { color: var(--text); font-weight: 650; }
.var-changed { animation: varPulse .5s ease; border-color: var(--accent); }
.var-highlight { border-color: var(--accent); background: var(--accent-soft); }
@keyframes varPulse { 0% { background: var(--accent-soft); } 100% { background: #22283a; } }
.var-toggle { font-size: 12px; color: var(--text-dim); cursor: pointer; padding: 4px 0; user-select: none; }
.control-bar {
  min-height: var(--control-height);
  flex-shrink: 0;
  background: var(--panel);
  border-top: 1px solid var(--border);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  position: relative;
  z-index: 20;
}
.transport-controls { display: flex; align-items: center; gap: 7px; }
.btn {
  min-height: 38px;
  background: #22283a;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  white-space: nowrap;
}
.btn:hover:not(:disabled) { background: #2a3247; border-color: #4c5872; }
.btn:disabled { opacity: .36; cursor: not-allowed; }
.btn-primary { min-width: 82px; background: var(--accent-soft); border-color: var(--accent); }
.btn-active { background: #285176; border-color: #77bfff; }
.step-info {
  margin-left: auto;
  min-width: 68px;
  font-size: 12px;
  color: var(--text-dim);
  white-space: nowrap;
}
.step-info strong { color: var(--text); }
.settings-menu { position: relative; }
.settings-menu summary {
  list-style: none;
  min-height: 38px;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-soft);
  cursor: pointer;
  font-size: 12px;
  user-select: none;
}
.settings-menu summary::-webkit-details-marker { display: none; }
.settings-menu[open] summary { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
.settings-popover {
  position: absolute;
  right: 0;
  bottom: calc(100% + 10px);
  width: 250px;
  padding: 14px;
  display: grid;
  gap: 12px;
  background: rgba(23,28,43,.98);
  border: 1px solid #3a465f;
  border-radius: 12px;
  box-shadow: 0 16px 42px rgba(0,0,0,.38);
}
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.setting-row label, .shortcut-help { font-size: 12px; color: var(--text-dim); }
.speed-slider { width: 130px; accent-color: var(--accent); }
.font-control { display: flex; align-items: center; gap: 6px; }
.btn-sm { min-height: 32px; padding: 5px 10px; font-size: 12px; }
.settings-divider { height: 1px; background: var(--border); }
.shortcut-help { line-height: 1.65; }

@media (max-width: 1050px) {
  .code-panel { width: 42%; min-width: 320px; }
  .chapter-status { display: none; }
  .breakpoint-hint { display: none; }
  .btn { padding-inline: 10px; }
}

@media (max-width: 900px) {
  body { overflow: auto; padding-bottom: 72px; }
  .header {
    height: auto;
    min-height: 60px;
    padding: 8px 12px;
    gap: 10px;
    position: sticky;
    top: 0;
  }
  .back-link { font-size: 0; width: 36px; height: 36px; display: grid; place-items: center; }
  .back-link::before { content: '←'; font-size: 21px; }
  .chapter-kicker { font-size: 10px; }
  .chapter-heading h1 { font-size: 16px; }
  .chapter-nav a, .chapter-nav span { width: 34px; min-width: 34px; padding: 0; font-size: 0; }
  .chapter-nav a:first-child::before, .chapter-nav span:first-child::before { content: '‹'; font-size: 22px; }
  .chapter-nav a:last-child::before, .chapter-nav span:last-child::before { content: '›'; font-size: 22px; }
  .mobile-view-switcher {
    position: sticky;

  .mobile-view-switcher button {
    min-height: 38px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--text-dim);
  }
  .mobile-view-switcher button.active {
    color: #e8f3ff;
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .main { display: block; height: auto; min-height: calc(100dvh - 114px); }
  .code-panel, .right-panel { width: 100%; min-width: 0; border: 0; }
  .code-panel { height: calc(100dvh - 186px); }
  .code-header { padding: 8px 10px; overflow: hidden; }
  .algo-tabs { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 3px; scrollbar-width: thin; }
  .algo-tab { flex: 0 0 auto; min-height: 38px; }
  .mode-tabs { padding: 7px 10px; overflow-x: auto; }
  .code-body { min-height: 0; font-size: max(13px,var(--code-font-size,15px)); }
  .code-line { padding-right: 12px; }
  .right-panel { min-height: calc(100dvh - 186px); overflow: visible; }
  .viz-panel { height: calc(100dvh - 186px); min-height: 430px; flex: none !important; padding: 8px 10px !important; }
  .vars-panel { min-height: 50dvh; padding: 14px; }
  .output-panel { min-height: 28dvh; padding: 12px 14px; }
  body[data-mobile-view="animation"] .code-panel,
  body[data-mobile-view="animation"] .vars-panel,
  body[data-mobile-view="animation"] .output-panel { display: none; }
  body[data-mobile-view="code"] .right-panel > :not(.control-bar),
  body[data-mobile-view="code"] .vars-panel,
  body[data-mobile-view="code"] .output-panel { display: none; }
  body[data-mobile-view="code"] .right-panel { min-height: 0; }
  body[data-mobile-view="data"] .code-panel,
  body[data-mobile-view="data"] .viz-panel { display: none; }
  body[data-mobile-view="data"] .right-panel { min-height: calc(100dvh - 186px); }
  .control-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    min-height: 72px;
    padding: 9px max(10px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
    justify-content: center;
    gap: 8px;
    box-shadow: 0 -10px 30px rgba(9,12,20,.36);
  }
  .transport-controls { gap: 7px; }
  #btn-reset { display: none; }
  .btn { min-width: 48px; min-height: 44px; padding: 8px 10px; font-size: 0; }
  #btn-back::after { content: '◀'; font-size: 16px; }
  #btn-play { min-width: 92px; font-size: 14px; }
  #btn-step::after { content: '▶'; font-size: 16px; }
  .step-info { margin-left: 0; min-width: 52px; text-align: center; font-size: 11px; }
  .step-info .step-prefix { display: none; }
  .settings-menu summary { width: 44px; min-height: 44px; padding: 0; justify-content: center; font-size: 0; }
  .settings-menu summary::before { content: '⚙'; font-size: 17px; }
  .settings-popover { right: -2px; width: min(280px,calc(100vw - 20px)); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;

  }
}
</style>

<script>
const CHAPTER_NUM = 2;
const ALGOS = {
  "01_顺序查找_复杂度分析": {
    "title": "顺序查找（复杂度分析）",
    "defaultMode": "concept",
    "modeLabels": {
      "concept": "理解动画",
      "trace": "代码执行"
    },
    "modes": {
      "concept": {
        "title": "顺序查找（复杂度分析）",
        "source": [
          "算法: 顺序查找复杂度分析",
          "输入: 数组 arr 和目标 target",
          "从第 0 个元素开始逐个比较",
          "如果命中, 立即返回当前位置",
          "如果扫完整个数组还没命中, 返回 -1",
          "",
          "最好情况: 第 1 步命中 -> O(1)",

        "important_vars": {

          "steps": "步数",
          "case": "情况"

        "track_vars": {
          "primary": [
            "target",
            "steps",

          "#include <stdio.h>",
          "/* 交换两个数 */",
          "void swap(int *a, int *b) {",
          "    int temp = *a;",
          "    *a = *b;",
          "    *b = temp;",
          "}",
          "/* 分区函数：选最后一个元素作为基准，小的放左边，大的放右边 */",
          "int partition(int arr[], int low, int high) {",
          "    int pivot = arr[high];  /* 基准值 */",
          "    int i = low - 1;        /* \"小元素区\"的边界 */",
          "    for (int j = low; j < high; j++) {",
          "        if (arr[j] < pivot) {",
          "            i++;",
          "            swap(&arr[i], &arr[j]);",
          "        }",
          "    }",
          "    swap(&arr[i + 1], &arr[high]);",
          "    return i + 1;",
          "}",
          "/* 快速排序 */",
          "void quick_sort(int arr[], int low, int high) {",
          "    if (low < high) {",
          "        int pi = partition(arr, low, high);",
          "        quick_sort(arr, low, pi - 1);   /* 排左边 */",
          "        quick_sort(arr, pi + 1, high);  /* 排右边 */",
          "    }",
          "}",
          "void print_array(int arr[], int n) {",
          "    for (int i = 0; i < n; i++) {",
          "        printf(\"%d \", arr[i]);",
          "    }",
          "    printf(\"\\n\");",
          "}",
          "int main(void) {",
          "    int arr[] = {10, 7, 8, 9, 1, 5};",
          "    int n = 6;",
          "    printf(\"排序前：\");",
          "    print_array(arr, n);",
          "    quick_sort(arr, 0, n - 1);",
          "    printf(\"排序后：\");",
          "    print_array(arr, n);",
          "    return 0;",
          "}"

          "/* 原地反转数组：空间复杂度 O(1) */",
          "void reverse_array(int arr[], int n) {",
          "    int left = 0, right = n - 1;",
          "    while (left < right) {",
          "        int temp = arr[left];",
          "        arr[left] = arr[right];",
          "        arr[right] = temp;",
          "        left++;",
          "        right--;",
          "    }",

        "source": [
          "#include <stdio.h>",
          "#include <stdlib.h>",
          "/* 合并两个有序子数组；成功返回 1，内存分配失败返回 0 */",
          "int merge(int arr[], int left, int mid, int right) {",
          "    int n1 = mid - left + 1;  /* 左半部分的大小 */",
          "    int n2 = right - mid;      /* 右半部分的大小 */",
          "    /* 创建临时数组——这就是额外空间！ */",
          "    int *L = (int *)malloc(n1 * sizeof(int));",
          "    int *R = (int *)malloc(n2 * sizeof(int));",
          "    if (L == NULL || R == NULL) {",
          "        free(L);",
          "        free(R);",
          "        return 0;",
          "    }",
          "    /* 拷贝数据到临时数组 */",
          "    for (int i = 0; i < n1; i++)",
          "        L[i] = arr[left + i];",
          "    for (int j = 0; j < n2; j++)",
          "        R[j] = arr[mid + 1 + j];",
          "    /* 合并回原数组 */",
          "    int i = 0, j = 0, k = left;",
          "    while (i < n1 && j < n2) {",
          "        if (L[i] <= R[j]) {",
          "            arr[k++] = L[i++];",
          "        } else {",
          "            arr[k++] = R[j++];",
          "        }",
          "    }",
          "    /* 把剩余的元素也塞进去 */",
          "    while (i < n1) arr[k++] = L[i++];",
          "    while (j < n2) arr[k++] = R[j++];",
          "    free(L);",
          "    free(R);",
          "    return 1;",
          "}",
          "/* 归并排序；成功返回 1，失败返回 0 */",
          "int merge_sort(int arr[], int left, int right) {",
          "    if (left < right) {",
          "        int mid = left + (right - left) / 2;",
          "        if (!merge_sort(arr, left, mid)) return 0;       /* 排左半 */",
          "        if (!merge_sort(arr, mid + 1, right)) return 0;  /* 排右半 */",
          "        if (!merge(arr, left, mid, right)) return 0;     /* 合并 */",
          "    }",
          "    return 1;",
          "}",
          "int main(void) {",
          "    int arr[] = {38, 27, 43, 3, 9, 82, 10};",
          "    int n = 7;",
          "    if (!merge_sort(arr, 0, n - 1)) {",

          "        return 1;",
          "    }",
          "    for (int i = 0; i < n; i++) {",
          "        printf(\"%d \", arr[i]);",
          "    }",
          "    printf(\"\\n\");",
          "    return 0;",
          "}"

          "#include <stdio.h>",
          "#include <stdlib.h>",
          "typedef struct {",
          "    int *data;     // 实际存储数据的数组",
          "    int size;      // 当前元素个数",
          "    int capacity;  // 当前容量",
          "} DynamicArray;",
          "/* 创建动态数组 */",
          "DynamicArray* create_array(int initial_capacity) {",
          "    DynamicArray *arr = (DynamicArray *)malloc(sizeof(DynamicArray));",
          "    if (arr == NULL) {",
          "        return NULL;",
          "    }",
          "    arr->data = (int *)malloc(initial_capacity * sizeof(int));",
          "    if (arr->data == NULL) {",
          "        free(arr);",
          "        return NULL;",
          "    }",
          "    arr->size = 0;",
          "    arr->capacity = initial_capacity;",
          "    return arr;",
          "}",
          "/* 添加元素（核心） */",
          "void push_back(DynamicArray *arr, int value) {",
          "    /* 如果满了，翻倍扩容 */",
          "    if (arr->size == arr->capacity) {",
          "        int new_capacity = arr->capacity * 2;  /* 容量翻倍 */",
          "        int *temp = (int *)realloc(arr->data, new_capacity * sizeof(int));",
          "        if (temp == NULL) {",
          "            printf(\"  扩容失败：内存不足！\\n\");",
          "            return;",
          "        }",
          "        arr->data = temp;  /* 确认成功后再赋值 */",
          "        arr->capacity = new_capacity;",
          "        printf(\"  扩容：新容量：%d\\n\", arr->capacity);",
          "    }",
          "    arr->data[arr->size++] = value;",
          "}",
          "/* 销毁 */",
          "void destroy_array(DynamicArray *arr) {",
          "    if (arr == NULL) {",
          "        return;",
          "    }",
          "    free(arr->data);",
          "    free(arr);",
          "}",
          "int main(void) {",
          "    DynamicArray *arr = create_array(2);  /* 初始容量 2 */",
          "    if (arr == NULL) {",
          "        printf(\"创建动态数组失败！\\n\");",
          "        return 1;",
          "    }",
          "    printf(\"往动态数组里塞 10 个元素：\\n\");",
          "    for (int i = 1; i <= 10; i++) {",
          "        printf(\"添加 %d → \", i);",
          "        push_back(arr, i);",
          "        printf(\"size=%d, capacity=%d\\n\", arr->size, arr->capacity);",
          "    }",
          "    destroy_array(arr);",
          "    return 0;",
          "}"

                "name": "线性时间",
                "example": "遍历数组",
                "n10": "10步",
                "n100": "100步",
                "n1000": "1000步",
                "weight": 0.42
              },
              {
                "order": "O(n log n)",
                "name": "线性对数",
                "example": "归并/堆排序",
                "n10": "~33步",
                "n100": "~664步",
                "n1000": "~9966步",
                "weight": 0.56
              },
              {
                "order": "O(n^2)",
                "name": "平方时间",
                "example": "两两比较",
                "n10": "100步",
                "n100": "1万步",
                "n1000": "100万步",
                "weight": 0.72
              },
              {
                "order": "O(2^n)",
                "name": "指数时间",
                "example": "穷举子集",
                "n10": "1024步",
                "n100": "天文数字",
                "n1000": "别想了",
                "weight": 0.88
              },
              {
                "order": "O(n!)",
                "name": "阶乘时间",
                "example": "穷举排列",
                "n10": "362万步",
                "n100": "宇宙级",
                "n1000": "不可想象",
                "weight": 1.0
              }
            ],
            "active": 6,
            "phase": "O(n!) 更夸张, 只能处理很小规模或换思路"
          }
        }
      }
    ]
  }
};
const firstKey = Object.keys(ALGOS)[0];
const requestedKey = new URLSearchParams(location.search).get('algo');
const savedAtOpen = DHLearning.load();
let currentKey = ALGOS[requestedKey]
  ? requestedKey
  : (savedAtOpen.last && savedAtOpen.last.chapter === CHAPTER_NUM && ALGOS[savedAtOpen.last.algorithm]
      ? savedAtOpen.last.algorithm
      : firstKey);
let currentMode = null;
const engine = new TraceEngine('viz-canvas', 'code-body', 'var-grid', 'callstack');
const tabsEl = document.getElementById('algo-tabs');
const modeTabsEl = document.getElementById('mode-tabs');

function has_modes(algo) {
  return algo && algo.modes && typeof algo.modes === 'object';
}

function mode_label(rawAlgo, mode) {
  const labels = rawAlgo.modeLabels || {};
  if (labels[mode]) return labels[mode];
  if (mode === 'concept') return '理解动画';
  if (mode === 'trace') return '代码执行';
  return mode;
}

function resolve_algo(rawAlgo) {
  if (!has_modes(rawAlgo)) return rawAlgo;
  const mode = currentMode || rawAlgo.defaultMode || Object.keys(rawAlgo.modes)[0];
  return rawAlgo.modes[mode] || rawAlgo.modes[rawAlgo.defaultMode] || Object.values(rawAlgo.modes)[0];
}

function is_concept_algo(algo) {
  if (!algo) return false;
  const classes = algo.var_classes || {};
  if (Object.values(classes).some(info => info && info.type === 'concept')) return true;
  return (algo.steps || []).some(step => step.vars && step.vars.concept);
}

function update_tab_states() {
  const completed = new Set(DHLearning.load().completedDemos);
  tabsEl.querySelectorAll('.algo-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.key === currentKey);
    btn.classList.toggle('completed', completed.has(DHLearning.demoId(CHAPTER_NUM, btn.dataset.key)));
    btn.setAttribute('aria-selected', String(btn.dataset.key === currentKey));
  });
}

function update_chapter_progress() {
  const state = DHLearning.load();
  const completed = new Set(state.completedDemos);
  const keys = Object.keys(ALGOS);
  const done = keys.filter(key => completed.has(DHLearning.demoId(CHAPTER_NUM, key))).length;
  document.getElementById('chapter-progress-text').textContent = `${done} / ${keys.length} 个演示完成`;
  document.getElementById('chapter-progress-fill').style.width = `${keys.length ? done / keys.length * 100 : 0}%`;
  update_tab_states();
}

function render_mode_tabs(rawAlgo) {
  modeTabsEl.innerHTML = '';
  if (!has_modes(rawAlgo)) {
    modeTabsEl.classList.remove('visible');
    currentMode = null;
    return;
  }
  modeTabsEl.classList.add('visible');
  const label = document.createElement('span');
  label.className = 'mode-label';
  label.textContent = '学习方式';
  modeTabsEl.appendChild(label);
  const activeMode = currentMode || rawAlgo.defaultMode || Object.keys(rawAlgo.modes)[0];
  Object.keys(rawAlgo.modes).forEach(mode => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'mode-tab' + (mode === activeMode ? ' active' : '');
    btn.textContent = mode_label(rawAlgo, mode);
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', String(mode === activeMode));
    btn.addEventListener('click', () => {
      if (currentMode === mode) return;
      currentMode = mode;
      load_current_algo(false);
      if (matchMedia('(max-width: 900px)').matches) {
        set_mobile_view(mode === 'trace' ? 'code' : 'animation');
      }
    });
    modeTabsEl.appendChild(btn);
  });
}

function load_current_algo(allowRestore = true) {
  const rawAlgo = ALGOS[currentKey];
  const beforeLoad = DHLearning.load().last;
  if (has_modes(rawAlgo)) {
    const savedMode = beforeLoad && beforeLoad.chapter === CHAPTER_NUM && beforeLoad.algorithm === currentKey
      ? beforeLoad.mode
      : null;
    if (!currentMode) currentMode = savedMode && rawAlgo.modes[savedMode]
      ? savedMode
      : (rawAlgo.defaultMode || Object.keys(rawAlgo.modes)[0]);
  } else {
    currentMode = null;
  }
  render_mode_tabs(rawAlgo);
  const activeAlgo = resolve_algo(rawAlgo);
  document.body.classList.toggle('concept-mode', currentMode === 'concept' || is_concept_algo(activeAlgo));
  engine.stop_play();
  engine.load(activeAlgo);
  try {
    const currentUrl = new URL(location.href);
    currentUrl.searchParams.set('algo', currentKey);
    history.replaceState(null, '', currentUrl.href);
  } catch (_) {
    // file:// 预览环境可能限制 history API，不影响演示本身。
  }
  update_tab_states();

  if (
    allowRestore
    && beforeLoad
    && beforeLoad.chapter === CHAPTER_NUM
    && beforeLoad.algorithm === currentKey
    && beforeLoad.mode === currentMode
    && beforeLoad.step > 0
    && activeAlgo.steps.length
  ) {
    const restoreStep = Math.min(beforeLoad.step, activeAlgo.steps.length - 1);
    requestAnimationFrame(() => engine.go_to_step(restoreStep));
  }
}

Object.entries(ALGOS).forEach(([key, algo]) => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'algo-tab';
  btn.dataset.key = key;
  btn.textContent = algo.title;
  btn.setAttribute('role', 'tab');
  btn.setAttribute('aria-selected', String(key === currentKey));
  btn.addEventListener('click', () => {
    if (currentKey === key) return;
    currentKey = key;
    currentMode = has_modes(algo) ? (algo.defaultMode || Object.keys(algo.modes)[0]) : null;
    load_current_algo(true);
  });
  tabsEl.appendChild(btn);
});

document.addEventListener('dh:stepchange', event => {
  const detail = event.detail || {};
  DHLearning.updateLast(CHAPTER_NUM, currentKey, currentMode, detail.currentStep);
  if (detail.atEnd) DHLearning.markDemoComplete(CHAPTER_NUM, currentKey);
  update_chapter_progress();
});

document.getElementById('btn-play').addEventListener('click', () => engine.playing ? engine.stop_play() : engine.start_play());
document.getElementById('btn-step').addEventListener('click', () => { engine.stop_play(); engine.step_forward(); });
document.getElementById('btn-reset').addEventListener('click', () => engine.reset());
document.getElementById('btn-back').addEventListener('click', () => { engine.stop_play(); engine.step_backward(); });
document.getElementById('btn-to-bp').addEventListener('click', () => { engine.stop_play(); engine.play_to_bp(); });

const speedSlider = document.getElementById('speed-slider');
const savedSpeed = localStorage.getItem('dh_speed');
if (savedSpeed !== null) speedSlider.value = savedSpeed;
speedSlider.setAttribute('aria-valuetext', `速度 ${speedSlider.value}`);
speedSlider.addEventListener('input', () => {
  localStorage.setItem('dh_speed', speedSlider.value);
  speedSlider.setAttribute('aria-valuetext', `速度 ${speedSlider.value}`);
  if (engine.playing) { clearTimeout(engine.playTimer); engine._play_loop(); }
});
speedSlider.addEventListener('keydown', event => {
  if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
  event.preventDefault();
  event.stopPropagation();
  const direction = event.key === 'ArrowRight' ? 1 : -1;
  speedSlider.value = String(Math.max(Number(speedSlider.min), Math.min(Number(speedSlider.max), Number(speedSlider.value) + direction)));
  speedSlider.dispatchEvent(new Event('input', { bubbles: true }));
});
document.getElementById('font-dec').addEventListener('click', () => engine.font_dec());
document.getElementById('font-inc').addEventListener('click', () => engine.font_inc());

document.addEventListener('keydown', event => {
  const target = event.target;
  if (target && target.closest && target.closest('button,input,select,textarea,a,summary,[contenteditable="true"]')) return;
  if (event.key === ' ') {
    event.preventDefault();
    engine.playing ? engine.stop_play() : engine.start_play();
  } else if (event.key === 'ArrowRight') {
    event.preventDefault();
    engine.stop_play();
    engine.step_forward();
  } else if (event.key === 'ArrowLeft') {
    event.preventDefault();
    engine.stop_play();
    engine.step_backward();
  } else if (event.key.toLowerCase() === 'r' && !event.metaKey && !event.ctrlKey && !event.altKey) {
    engine.reset();
  }
});

function set_mobile_view(view) {
  document.body.dataset.mobileView = view;
  document.querySelectorAll('.mobile-view-switcher button').forEach(btn => {
    const active = btn.dataset.mobileView === view;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-selected', String(active));
  });
  if (view === 'animation' && engine.currentStep >= 0) {
    requestAnimationFrame(() => engine.go_to_step(engine.currentStep));
  }
}

document.querySelectorAll('.mobile-view-switcher button').forEach(btn => {
  btn.addEventListener('click', () => set_mobile_view(btn.dataset.mobileView));
});

DHLearning.visitChapter(CHAPTER_NUM);
update_chapter_progress();
load_current_algo(true);
</script>
</body>
</html>
